name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      proof_base:
        description: Base commit for testing the PR selector on the disposable proof branch
        required: true
        type: string

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  # A successful PR can have skipped jobs. Always run the full suite on main.
  scope:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.s.outputs.go }}
      web: ${{ steps.s.outputs.web }}
      integration: ${{ steps.s.outputs.integration }}
      e2e: ${{ steps.s.outputs.e2e }}
      full: ${{ steps.s.outputs.full }}
      go_paths: ${{ steps.s.outputs.go_paths }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          filter: blob:none
          persist-credentials: false

      - id: s
        name: Select CI checks
        env:
          EVENT: ${{ github.event_name == 'workflow_dispatch' && 'pull_request' || github.event_name }}
          BASE_SHA: ${{ inputs.proof_base || github.event.pull_request.base.sha }}
          FULL_PR: ${{ startsWith(github.event.pull_request.title, '[full-ci] ') }}
        run: python3 tools/ci/scope.py

  # Go: format, vet, lint, unit and contract tests with -race, deploy bookkeeping, agent size, govulncheck.
  go:
    needs: scope
    if: needs.scope.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          filter: blob:none
          persist-credentials: false

      - id: go-cache
        uses: ./.gitea/actions/go-cache
        with:
          profile: race

      - name: Cache golangci-lint analysis
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('tools/go.sum', '.golangci.yml') }}

      - name: make check-go
        env:
          CI_GO_PATHS: ${{ needs.scope.outputs.go_paths }}
        run: make -k check-go scan-go

      - name: Seed Go cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.go-cache.outputs.paths }}
          key: ${{ steps.go-cache.outputs.key }}

  # Web: generated code current, prettier, eslint, svelte-check, vitest, audit of shipped web packages.
  web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          filter: blob:none
          persist-credentials: false

      - id: go-cache
        uses: ./.gitea/actions/go-cache
        with:
          profile: generator

      - id: node-cache
        uses: ./.gitea/actions/node-cache

      - name: make check-web
        run: make -k check-web scan-web

      - name: Seed pnpm cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.node-cache.outputs.hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.node-cache.outputs.path }}
          key: ${{ steps.node-cache.outputs.key }}

      - name: Seed Go cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.go-cache.outputs.paths }}
          key: ${{ steps.go-cache.outputs.key }}

  # 11-delivery.md §4: real binaries (sshd, Traefik, Pebble) in containers on the runner's Docker.
  integration:
    needs: scope
    if: needs.scope.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          filter: blob:none
          persist-credentials: false

      - id: go-cache
        uses: ./.gitea/actions/go-cache
        with:
          profile: integration

      - name: make test-integration
        run: make -k test-integration pulse-image-size

      - name: Seed Go cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.go-cache.outputs.paths }}
          key: ${{ steps.go-cache.outputs.key }}

  # 11-delivery.md §4: E2E when the UI or the API behind it changed.
  e2e:
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          filter: blob:none
          persist-credentials: false

      - id: go-cache
        uses: ./.gitea/actions/go-cache
        with:
          profile: dev

      - id: node-cache
        uses: ./.gitea/actions/node-cache

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          # A lockfile change without a new Playwright still finds its browser in the last cache, instead of a 150 MB
          # download from the CI network (which timed out repeatedly, docs/bugs.md).
          restore-keys: playwright-${{ runner.os }}-

      - name: Install web packages and Chromium for Playwright
        run: make chromium-install

      - name: make test-e2e
        # The preceding step installed all dependencies, including the frozen pnpm lockfile.
        run: make -o web-install test-e2e

      - name: Hashi's log from the e2e run
        if: failure()
        run: tail -n 400 web/e2e/.hashi.log || echo "no log written"

      - name: Seed Go cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.go-cache.outputs.paths }}
          key: ${{ steps.go-cache.outputs.key }}

  # Require this exact PR status in Gitea branch protection. Selective feedback leaves it skipped.
  full-suite:
    needs: [scope, go, web, integration, e2e]
    if: always() && needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require success from every job
        env:
          SCOPE: ${{ needs.scope.result }}
          GO: ${{ needs.go.result }}
          WEB: ${{ needs.web.result }}
          INTEGRATION: ${{ needs.integration.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          printf '%s\n' "scope=$SCOPE" "go=$GO" "web=$WEB" "integration=$INTEGRATION" "e2e=$E2E"
          test "$SCOPE/$GO/$WEB/$INTEGRATION/$E2E" = success/success/success/success/success
