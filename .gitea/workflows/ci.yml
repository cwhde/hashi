name: CI

# Skips docs-only and V1-only changes; those cannot affect `make check`.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache golangci-lint analysis
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('tools/go.sum', '.golangci.yml') }}

      - name: make check
        run: make check

      # Threat model §7: known vulnerabilities in Go modules (reachable code) and shipped web packages.
      - name: make scan
        run: make scan

  # 11-delivery.md §4: real binaries (sshd, Traefik, Pebble) in containers on the runner's Docker.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: make test-integration
        run: make test-integration
      - name: Agent image size
        run: make pulse-image-size

  # 11-delivery.md §4: E2E only when the UI or the API behind it changed (always on main).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Changed paths
        id: paths
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if grep -qE '^(web/|api/|internal/|cmd/|go\.mod|Makefile|\.gitea/workflows/ci\.yml)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no UI/API change: E2E skipped"
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.paths.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.paths.outputs.run == 'true'
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.paths.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache Playwright browsers
        if: steps.paths.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          # A lockfile change without a new Playwright still finds its browser in the last cache, instead of a 150 MB
          # download from the CI network (which timed out repeatedly, docs/bugs.md).
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium for Playwright
        if: steps.paths.outputs.run == 'true'
        run: cd web && pnpm install --frozen-lockfile --silent && pnpm exec playwright install --with-deps chromium

      - name: make test-e2e
        if: steps.paths.outputs.run == 'true'
        run: make test-e2e

      - name: Hashi's log from the e2e run
        if: failure() && steps.paths.outputs.run == 'true'
        run: tail -n 400 web/e2e/.hashi.log || echo "no log written"
