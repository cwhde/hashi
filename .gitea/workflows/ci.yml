name: CI

on:
  push:
    branches: [main, feat/v2-foundation]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'web/**'
      - 'openapi/**'
      - 'scripts/**'
      - 'Hashi.slnx'
      - 'Directory.Build.props'
      - '.gitea/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hashi
          POSTGRES_USER: hashi
          POSTGRES_PASSWORD: hashi
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore, format, test, build
        run: |
          dotnet restore Hashi.slnx
          dotnet format Hashi.slnx --verify-no-changes
          dotnet test tests/Hashi.UnitTests/Hashi.UnitTests.csproj --no-restore --verbosity normal
          dotnet build src/Hashi.Api/Hashi.Api.csproj -c Release --no-restore /p:SkipFrontendBuild=true

  openapi-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Verify OpenAPI contract (spec §30)
        run: |
          chmod +x scripts/export-openapi.sh scripts/generate-api-client.sh
          ./scripts/export-openapi.sh
          cd web && pnpm install --frozen-lockfile
          cd ..
          ./scripts/generate-api-client.sh
          git diff --exit-code openapi/hashi.json web/src/lib/api/schema.d.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
