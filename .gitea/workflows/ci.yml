name: CI

on:
  push:
    branches: [main, feat/v2-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      openapi: ${{ steps.filter.outputs.openapi }}
      agents: ${{ steps.filter.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          backend=false
          frontend=false
          openapi=false
          agents=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            backend=true
            frontend=true
            openapi=true
            agents=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            backend=true
            frontend=true
            openapi=true
            agents=true
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base=HEAD~1
            fi
            files="$(git diff --name-only "$base" HEAD 2>/dev/null || git show --pretty='' --name-only HEAD)"
            echo "Changed files:"
            echo "$files"

            if echo "$files" | grep -qE '^(src/|tests/|Hashi\.slnx|Directory\.Build\.props|\.gitea/workflows/ci\.yml)'; then
              backend=true
            fi
            if echo "$files" | grep -qE '^(web/|\.gitea/workflows/ci\.yml)'; then
              frontend=true
            fi
            if echo "$files" | grep -qE '^(src/|openapi/|scripts/|web/src/lib/api/|\.gitea/workflows/ci\.yml)'; then
              openapi=true
            fi
            if echo "$files" | grep -qE '^(agents/|\.gitea/workflows/ci\.yml)'; then
              agents=true
            fi
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "openapi=$openapi" >> "$GITHUB_OUTPUT"
          echo "agents=$agents" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hashi
          POSTGRES_USER: hashi
          POSTGRES_PASSWORD: hashi
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore, format, test, build
        env:
          ConnectionStrings__Hashi: Host=localhost;Port=5432;Database=hashi;Username=hashi;Password=hashi
          HASHI_SKIP_STARTUP_HOOKS: '1'
        run: |
          dotnet restore Hashi.slnx
          dotnet format Hashi.slnx --verify-no-changes
          dotnet test tests/Hashi.UnitTests/Hashi.UnitTests.csproj --no-restore --verbosity normal
          dotnet test tests/Hashi.IntegrationTests/Hashi.IntegrationTests.csproj --no-restore --verbosity normal
          dotnet build src/Hashi.Api/Hashi.Api.csproj -c Release --no-restore /p:SkipFrontendBuild=true

  openapi-verify:
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Verify OpenAPI contract (spec §30)
        run: |
          chmod +x scripts/export-openapi.sh scripts/generate-api-client.sh
          ./scripts/export-openapi.sh
          cd web && pnpm install --frozen-lockfile
          cd ..
          ./scripts/generate-api-client.sh
          git diff --exit-code openapi/hashi.json web/src/lib/api/schema.d.ts

  pulse-agent:
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents/pulse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build, test, and verify Docker image
        run: |
          make vet
          make test
          make build
          if command -v docker >/dev/null 2>&1; then
            docker build -t hashi-pulse:ci .
          else
            echo "Docker CLI unavailable — skipping image build verification."
          fi

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm run test:e2e
        env:
          CI: true
