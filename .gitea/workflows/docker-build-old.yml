name: Build and Publish Legacy Docker Image

# Release images for hashi:old
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'hashi.old/**'
      - '.gitea/workflows/docker-build-old.yml'

env:
  REGISTRY: git.juzo.io
  IMAGE_NAME: juzo/hashi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=old
          labels: |
            org.opencontainers.image.source=https://git.juzo.io/juzo/hashi
            org.opencontainers.image.description=Hashi (Legacy Version)
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: ./hashi.old
          file: ./hashi.old/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-old
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-old,mode=max
