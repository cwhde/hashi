name: Build and Publish Pulse Agent

# Pulse agent images and binaries on version tags and main - not every feature-branch push.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      - 'pulse-v*.*.*'
    branches:
      - main
    paths:
      - 'agents/pulse/**'
      - '.gitea/workflows/docker-build-pulse.yml'

env:
  REGISTRY: git.juzo.io
  IMAGE_NAME: juzo/hashi-pulse

jobs:
  build-native-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agents/pulse/go.mod
          cache: false

      - name: Cache Go modules and build data
        uses: actions/cache@v3
        continue-on-error: true
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-pulse-${{ runner.os }}-${{ hashFiles('agents/pulse/go.mod') }}
          restore-keys: |
            go-pulse-${{ runner.os }}-

      - name: Build Linux binaries
        working-directory: agents/pulse
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/hashi-pulse-linux-${arch}" ./cmd/hashi-pulse
          done
          cd dist
          sha256sum hashi-pulse-linux-amd64 > hashi-pulse-linux-amd64.sha256
          sha256sum hashi-pulse-linux-arm64 > hashi-pulse-linux-arm64.sha256

      # Gitea/GHES-compatible runners used here do not support the artifact v2 API
      # required by actions/upload-artifact@v4.
      - uses: actions/upload-artifact@v3
        with:
          name: hashi-pulse-linux-binaries
          path: |
            agents/pulse/dist/hashi-pulse-linux-amd64
            agents/pulse/dist/hashi-pulse-linux-amd64.sha256
            agents/pulse/dist/hashi-pulse-linux-arm64
            agents/pulse/dist/hashi-pulse-linux-arm64.sha256

      - name: Attach binaries to tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: token ${GITHUB_TOKEN}"
          release_json="$(curl -fsS -H "${auth_header}" "${api}/releases/tags/${tag}" || true)"
          if [ -z "${release_json}" ]; then
            release_json="$(printf '{"tag_name":"%s","name":"%s","draft":false,"prerelease":false}' "${tag}" "${tag}" |
              curl -fsS -H "${auth_header}" -H "Content-Type: application/json" -d @- "${api}/releases")"
          fi
          release_id="$(printf '%s' "${release_json}" | jq -r '.id')"
          for file in agents/pulse/dist/hashi-pulse-linux-*; do
            name="$(basename "${file}")"
            existing_id="$(curl -fsS -H "${auth_header}" "${api}/releases/${release_id}/assets" |
              jq -r --arg name "${name}" '.[] | select(.name == $name) | .id' | head -n1)"
            if [ -n "${existing_id}" ]; then
              curl -fsS -X DELETE -H "${auth_header}" "${api}/releases/${release_id}/assets/${existing_id}"
            fi
            curl -fsS -H "${auth_header}" -F "attachment=@${file}" "${api}/releases/${release_id}/assets?name=${name}"
          done

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{version}},prefix=pulse-
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ./agents/pulse
          file: ./agents/pulse/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
