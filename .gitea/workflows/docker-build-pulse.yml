name: Build and Publish Pulse Agent Image

# Pulse agent images on version tags and main — not every feature-branch push.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      - 'pulse-v*.*.*'
    branches:
      - main
    paths:
      - 'agents/pulse/**'
      - '.gitea/workflows/docker-build-pulse.yml'

env:
  REGISTRY: git.juzo.io
  IMAGE_NAME: juzo/hashi-pulse

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{version}},prefix=pulse-
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ./agents/pulse
          file: ./agents/pulse/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
