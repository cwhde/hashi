name: Release

# Multi-arch images to git.juzo.io/juzo/hashi on main and v* tags (11-delivery.md §6.1).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitea/workflows/ci.yml"
  workflow_dispatch:

env:
  REGISTRY: git.juzo.io
  IMAGE_NAME: juzo/hashi

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}

      - name: A version tag must be the release Hashi installs from
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q 'ReleaseTag = "${{ github.ref_name }}"' internal/pulse/release.go

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || steps.sha.outputs.short }}
            COMMIT=${{ steps.sha.outputs.short }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-v3
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-v3,mode=max,ignore-error=true

      # The agent image (08 §6), tagged exactly like the main one.
      - uses: docker/metadata-action@v5
        id: pulsemeta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hashi-pulse
          # latest follows version tags, not main: Docker agents on :latest run a released agent (ADR 0003).
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Pulse.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.pulsemeta.outputs.tags }}
          labels: ${{ steps.pulsemeta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || steps.sha.outputs.short }}

      # Threat model §7: both pushed images are scanned; a fixable HIGH or CRITICAL finding fails the job.
      - name: Scan the images
        run: |
          for img in hashi hashi-pulse; do
            docker run --rm aquasec/trivy:0.76.1 image --quiet --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 "$REGISTRY/${{ github.repository_owner }}/$img:${GITHUB_SHA::7}"
          done

  # On a tag: Pulse binaries with checksums on a Gitea release (08 §6). 
  pulse-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The tag must be the release Hashi installs from
        run: grep -q 'ReleaseTag = "${{ github.ref_name }}"' internal/pulse/release.go
      - name: Build
        run: make pulse-dist VERSION=${{ github.ref_name }}
      - name: Sign (ADR 0003); fails without the key, so no unsigned release goes out
        env:
          PULSE_SIGNING_KEY: ${{ secrets.PULSE_SIGNING_KEY }}
        run: make pulse-sign VERSION=${{ github.ref_name }}
      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in *-*) pre=true ;; *) pre=false ;; esac
          id=$(curl -fsS -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"prerelease\":$pre}" "$API/releases" | jq -r .id)
          for f in dist/pulse/*; do
            curl -fsS -H "Authorization: token $TOKEN" -F "attachment=@$f" "$API/releases/$id/assets?name=$(basename "$f")" >/dev/null
          done
