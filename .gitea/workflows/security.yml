name: Security

on:
  push:
    branches: [main, feat/v2-foundation]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  CI: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks secret scan
        run: |
          GITLEAKS_VERSION=8.22.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          /tmp/gitleaks detect --source . --verbose --redact

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Vulnerable packages (.NET)
        run: |
          dotnet restore Hashi.slnx
          dotnet list package --vulnerable --include-transitive > vuln.txt || true
          cat vuln.txt
          if grep -E 'High|Critical' vuln.txt; then
            echo "High or critical vulnerabilities found"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high

      - name: Semgrep static analysis
        run: |
          pip install semgrep
          semgrep --config p/default --error --severity ERROR src/ web/src/ agents/pulse/

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
