name: Security

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks secret scan
        run: |
          GITLEAKS_VERSION=8.22.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          chmod +x /tmp/gitleaks
          printf '%s\n' 'hashi.old/' > .gitleaksignore
          /tmp/gitleaks detect --source . --verbose --redact

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Vulnerable packages (.NET)
        run: |
          dotnet restore Hashi.slnx
          dotnet list package --vulnerable --include-transitive > vuln.txt || true
          cat vuln.txt
          if grep -E 'High|Critical' vuln.txt; then
            echo "High or critical vulnerabilities found"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high

      - name: Semgrep static analysis
        run: |
          python3 -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install 'semgrep>=1.76,<2'
          /tmp/semgrep-venv/bin/semgrep --config p/default --error --severity ERROR \
            --exclude hashi.old \
            src/ web/src/ agents/pulse/

      - name: Trivy filesystem scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            aquasec/trivy:0.58.1 fs \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --skip-dirs hashi.old \
            /repo

      - uses: docker/setup-buildx-action@v3

      - name: Build image for vulnerability scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          load: true
          push: false
          tags: hashi:security-scan

      - name: Trivy container image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            hashi:security-scan
