name: Security

on:
  push:
    branches: [main, feat/v2-foundation]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  CI: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks secret scan
        run: |
          GITLEAKS_VERSION=8.22.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          chmod +x /tmp/gitleaks
          printf '%s\n' 'hashi.old/' > .gitleaksignore
          /tmp/gitleaks detect --source . --verbose --redact

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Vulnerable packages (.NET)
        run: |
          dotnet restore Hashi.slnx
          dotnet list package --vulnerable --include-transitive > vuln.txt || true
          cat vuln.txt
          if grep -E 'High|Critical' vuln.txt; then
            echo "High or critical vulnerabilities found"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high

      - name: Semgrep static analysis
        run: |
          python3 -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install 'semgrep>=1.76,<2'
          /tmp/semgrep-venv/bin/semgrep --config p/default --error --severity ERROR \
            --exclude hashi.old \
            src/ web/src/ agents/pulse/

      - name: Trivy filesystem scan
        run: |
          TRIVY_VERSION=0.58.1
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy fs --severity CRITICAL,HIGH --exit-code 1 \
            --skip-dirs hashi.old \
            .
