name: V1 - Build and Publish Docker Image

# Legacy V1 image (git.juzo.io/juzo/hashi:old), which production runs until the cutover (11-delivery.md §7).
# Rebuilds only when V1's own code changes; editing this file does not trigger a build (a rebuild re-publishes :old).
# Delete this workflow together with legacy/ at cutover.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "legacy/v1/**"
      - "!legacy/v1/**/*.md"

env:
  REGISTRY: git.juzo.io
  IMAGE_NAME: juzo/hashi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./legacy/v1
          file: ./legacy/v1/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:old
          labels: |
            org.opencontainers.image.source=https://git.juzo.io/juzo/hashi
            org.opencontainers.image.description=Hashi V1 (legacy)
            org.opencontainers.image.licenses=MIT
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-old
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-old,mode=max,ignore-error=true
