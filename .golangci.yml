version: "2"
run:
  timeout: 3m
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - sqlclosecheck
    - unconvert
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
