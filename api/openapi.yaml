          content: { application/json: { schema: { $ref: "#/components/schemas/FirewallPlans" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/firewall/hosts/{id}/takeover:
    get:
      operationId: getFirewallTakeover
      summary: What Hashi removes of the host's old firewall script
      tags: [firewall]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The takeover list
          content: { application/json: { schema: { $ref: "#/components/schemas/FirewallTakeover" } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putFirewallTakeover
      summary: Replace the takeover list and plan the host (05 §3.4)
      tags: [firewall]
      x-hashi-scopes: [firewall.apply]
      x-hashi-reauth: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FirewallTakeover" } } }
      responses:
        "200":
          description: Saved, with the plans it caused
          content: { application/json: { schema: { $ref: "#/components/schemas/FirewallPlans" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/firewall/bindings:
    get:
      operationId: getFirewallBindings
      summary: The IP sets bound to global firewall allow and block
      tags: [firewall]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Bindings
          content: { application/json: { schema: { $ref: "#/components/schemas/FirewallBindings" } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putFirewallBindings
      summary: Replace the global bindings and plan every managed host
      tags: [firewall]
      x-hashi-scopes: [firewall.apply]
      x-hashi-reauth: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FirewallBindings" } } }
      responses:
        "200":
          description: Saved, with the plans it caused
          content: { application/json: { schema: { $ref: "#/components/schemas/FirewallPlans" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/ip-sets:
    get:
      operationId: listIPSets
      summary: Every IP set with its last compile summary, system sets first
      tags: [ip-sets]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [user, system, feed, dynamic] } }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Slug, name or description text" }
      responses:
        "200":
          description: IP sets
          content: { application/json: { schema: { $ref: "#/components/schemas/IPSetList" } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createIPSet
      summary: Add a user IP set (empty; add elements next)
      tags: [ip-sets]
      x-hashi-scopes: [security.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IPSetInput" } } }
      responses:
        "200":
          description: The new set
          content: { application/json: { schema: { $ref: "#/components/schemas/IPSet" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/ip-sets/{id}:
    get:
      operationId: getIPSet
      summary: One IP set
      tags: [ip-sets]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The set
          content: { application/json: { schema: { $ref: "#/components/schemas/IPSet" } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateIPSet
      summary: Change a user set's slug, name and description
      tags: [ip-sets]
      x-hashi-scopes: [security.manage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IPSetInput" } } }
      responses:
        "200":
          description: The set
          content: { application/json: { schema: { $ref: "#/components/schemas/IPSet" } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteIPSet
      summary: Delete a user set that nothing uses (409 lists what still uses it)
      tags: [ip-sets]
      x-hashi-scopes: [security.manage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /api/ip-sets/{id}/elements:
    get:
      operationId: listIPSetElements
      summary: A set's own elements, filtered by address (containing), prefix (overlapping) or text
      tags: [ip-sets]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: "next_cursor of the previous page" }
      responses:
        "200":
          description: One page of elements in position order
          content: { application/json: { schema: { $ref: "#/components/schemas/IPSetElementPage" } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: addIPSetElement
      summary: Append an element to a user set (a set the firewall uses needs a fresh passkey confirmation, 02 §2)
      tags: [ip-sets]
      x-hashi-scopes: [security.manage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IPSetElementInput" } } }
      responses:
        "200":
          description: The new element
          content: { application/json: { schema: { $ref: "#/components/schemas/IPSetElement" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/ip-sets/{id}/elements/{elementId}:
    patch:
      operationId: updateIPSetElement
      summary: Replace an element's item, note and expiry
      tags: [ip-sets]
      x-hashi-scopes: [security.manage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: elementId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IPSetElementInput" } } }
      responses:
        "200":
          description: The element
          content: { application/json: { schema: { $ref: "#/components/schemas/IPSetElement" } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteIPSetElement
      summary: Remove an element from a user set
      tags: [ip-sets]
      x-hashi-scopes: [security.manage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: elementId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Problem" }
  /api/ip-sets/{id}/resolved:
    get:
      operationId: getIPSetResolved
      summary: The set compiled now (prefixes merged per family, single addresses for target positions, problems)
      tags: [ip-sets]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: family, in: query, required: false, schema: { type: string, enum: ["4", "6"] } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The compiled set (prefixes paginated)
          content: { application/json: { schema: { $ref: "#/components/schemas/IPSetResolved" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/ip-sets/{id}/consumers:
    get:
      operationId: getIPSetConsumers
      summary: What uses the set (parent sets, firewall bindings, DNS records, service targets)
      tags: [ip-sets]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Consumers
          content: { application/json: { schema: { $ref: "#/components/schemas/IPSetConsumerList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/addresses/{address}:
    get:
      operationId: lookupAddress
      summary: Every set that contains the address, with the nesting path to the element that holds it
      tags: [ip-sets]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: address, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The lookup
          content: { application/json: { schema: { $ref: "#/components/schemas/AddressLookup" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/certificates:
    get:
      operationId: listCertificates
      summary: Certificates with expiry, last renewal and per-host distribution
      tags: [traefik]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Certificates
          content: { application/json: { schema: { $ref: "#/components/schemas/CertificateList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/certificates/{id}/renew:
    post:
      operationId: renewCertificate
      summary: Renew now — a low-risk certificates plan for this certificate, applied right away (takes about a minute)
      tags: [traefik]
      x-hashi-scopes: [admin.write]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan after the run; distribution to the hosts follows with the daily job or "Check and sync"
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlanResult" } } }
        default: { $ref: "#/components/responses/Problem" }

  /api/sync/plans:
    get:
      operationId: listSyncPlans
      summary: Open plans (pending, approved, applying) with items, and recently finished ones
      tags: [sync]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Plans
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlanOverview" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/sync/plans/{id}:
    get:
      operationId: getSyncPlan
      summary: One plan with its exact items
      tags: [sync]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/sync/plans/{id}/approve:
    post:
      operationId: approveSyncPlan
      summary: Approve a pending (high-risk) plan
      tags: [sync]
      x-hashi-scopes: [sync.apply]
      x-hashi-reauth: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Approved
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/sync/plans/{id}/apply:
    post:
      operationId: applySyncPlan
      summary: Apply an approved plan now; it is re-planned first and returns to approval if a new high-risk item appeared
      tags: [sync]
      x-hashi-scopes: [sync.apply]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan that ran (applied or failed), or the new plan awaiting approval
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/sync/plans/{id}/discard:
    post:
      operationId: discardSyncPlan
      summary: Drop a pending or approved plan
      tags: [sync]
      x-hashi-scopes: [sync.apply]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Discarded
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---- vault (02 §5) ----
  /api/vault:
    get:
      operationId: getVault
      summary: Vault mode and state
      tags: [vault]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Vault state
          content: { application/json: { schema: { $ref: "#/components/schemas/VaultState" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/vault/secrets:
    get:
      operationId: listSecrets
      summary: Stored secrets (metadata only, never values)
      tags: [vault]
      x-hashi-scopes: [secrets.manage]
      responses:
        "200":
          description: Secrets
          content: { application/json: { schema: { $ref: "#/components/schemas/SecretList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/vault/secrets/{id}/reveal:
    post:
      operationId: revealSecret
      summary: Reveal one secret value (audited)
      tags: [vault]
      x-hashi-scopes: [secrets.manage]
      x-hashi-reauth: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The value
          content: { application/json: { schema: { $ref: "#/components/schemas/RevealedSecret" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---- activity (10b §3) ----
  /api/activity/audit:
    get:
      operationId: listAuditEvents
      summary: Audit log, newest first
      tags: [activity]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: target, in: query, schema: { type: string }, description: "Only events for this target, e.g. ip_set:<id>" }
      responses:
        "200":
          description: Events
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/activity/jobs:
    get:
      operationId: listJobs
      summary: Background jobs with last and next run (invariant 15)
      tags: [activity]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Jobs
          content: { application/json: { schema: { $ref: "#/components/schemas/JobList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/activity/logs:
    get:
      operationId: listLogLines
      summary: Recent log lines (already redacted), after a sequence number
      tags: [activity]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "200":
          description: Log lines
          content: { application/json: { schema: { $ref: "#/components/schemas/LogPage" } } }
        default: { $ref: "#/components/responses/Problem" }
components:
  headers:
    SetCookie:
      description: Session cookie (`__Host-hashi.session`, or `hashi.bootstrap` for bootstrap over plain HTTP)
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: "Stable URI per error kind, e.g. `/problems/reauth-required`" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    AuthSession:
      type: object
      required: [authenticated, setup_completed]
      properties:
        authenticated: { type: boolean }
        setup_completed: { type: boolean }
        id: { type: string, description: Correlation ID (salted hash prefix), not the token }
        method: { type: string, enum: [bootstrap, passkey, recovery] }
        scopes: { type: array, items: { type: string } }
        bound_ip: { type: string }
        created_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
        reauth_valid_until: { type: string, format: date-time }
        csrf_token: { type: string }
    BootstrapLogin:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 256 }
    RecoverLogin:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 128 }
    SessionInfo:
      type: object
      required: [id, method, bound_ip, created_at, last_seen_at, absolute_expires_at, current]
      properties:
        id: { type: string }
        method: { type: string }
        bound_ip: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
        current: { type: boolean }
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions: { type: array, items: { $ref: "#/components/schemas/SessionInfo" } }
    RevokedCount:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer }
    CeremonyOptions:
      type: object
      required: [ceremony_id, options]
      properties:
        ceremony_id: { type: string }
        options:
          type: object
          additionalProperties: true
          description: "WebAuthn options as produced by the server library (`{publicKey: …}`)"
    CeremonyResponse:
      type: object
      required: [ceremony_id, credential]
      properties:
        ceremony_id: { type: string }
        name: { type: string, maxLength: 64, description: Passkey name (registration only) }
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential serialized with `toJSON()`
    Passkey:
      type: object
      required: [id, name, label, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        label: { type: string, description: Authenticator model (AAGUID-derived), may be empty }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    PasskeyList:
      type: object
      required: [passkeys]
      properties:
        passkeys: { type: array, items: { $ref: "#/components/schemas/Passkey" } }
    PasskeyRename:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
    SetupStep:
      type: object
      required: [n, key, title, required, built, slice, status, last_error]
      properties:
        n: { type: integer }
        key: { type: string }
        title: { type: string }
        required: { type: boolean }
        built: { type: boolean, description: false = arrives in a later slice }
        slice: { type: string }
        status: { type: string, enum: [pending, in_progress, done, failed] }
        last_error: { type: string }
    SetupState:
      type: object
      required: [completed, steps]
      properties:
        completed: { type: boolean }
        steps: { type: array, items: { $ref: "#/components/schemas/SetupStep" } }
        base_settings: { $ref: "#/components/schemas/BaseSettings" }
        passkeys: { type: integer, description: Registered passkeys (setup sessions only) }
        dns: { $ref: "#/components/schemas/DNSConnectResult" }
        certificates: { $ref: "#/components/schemas/CertificateProvider" }
        traefik: { $ref: "#/components/schemas/TraefikConnection" }
        firewall: { $ref: "#/components/schemas/FirewallHost" }
        system_service: { $ref: "#/components/schemas/Service" }
    CertificateProviderInput:
      type: object
      required: [directory, email]
      properties:
        directory: { type: string, enum: [gts, letsencrypt, custom] }
        directory_url: { type: string, description: "ACME directory URL (custom only)" }
        email: { type: string }
        eab_kid: { type: string, description: External Account Binding key ID (required for gts) }
        eab_hmac: { type: string, writeOnly: true, description: "EAB HMAC key (base64url); omit to keep the stored one" }
        propagation_delay_s: { type: integer, minimum: 0, maximum: 600, description: "Extra wait after the value is visible (default 0)" }
        resolvers: { type: array, items: { type: string }, description: "DNS servers to check challenge values on; empty = the zone's nameservers" }
    CertificateProvider:
      type: object
      required: [directory, directory_url, email, eab_kid, has_eab_hmac, account_registered, propagation_delay_s, resolvers, health, last_error]
      properties:
        directory: { type: string, enum: [gts, letsencrypt, custom] }
        directory_url: { type: string }
        email: { type: string }
        eab_kid: { type: string }
        has_eab_hmac: { type: boolean }
        account_registered: { type: boolean }
        propagation_delay_s: { type: integer }
        resolvers: { type: array, items: { type: string } }
        health: { type: string, enum: [unknown, validating, healthy, degraded, failed] }
        last_validated_at: { type: string, format: date-time }
        last_error: { type: string }
    TraefikIdentity:
      type: object
      required: [public_key]
      properties:
        public_key: { type: string, description: authorized_keys line }
    HostKeyScanInput:
      type: object
      required: [host, port]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
    HostKey:
      type: object
      required: [type, fingerprint, key]
      properties:
        type: { type: string, description: "e.g. ssh-ed25519" }
        fingerprint: { type: string, description: "SHA256:… as ssh-keygen -lf shows it" }
        key: { type: string, format: byte, description: Wire-format public key (base64) }
    TraefikConnectionInput:
      type: object
      required: [name, host, port, user, auth, host_key]
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        user: { type: string }
        auth: { type: string, enum: [hashi_key, private_key, password] }
        credential: { type: string, writeOnly: true, description: "Private key or password; omit to keep the stored one" }
        passphrase: { type: string, writeOnly: true }
        host_key: { type: string, format: byte, description: "`key` from the scan the admin confirmed" }
        internal_ip: { type: string }
        traefik_binary: { type: string }
        config_dir: { type: string }
        api_port: { type: integer, minimum: 1024, maximum: 65534 }
    TraefikFile:
      type: object
      required: [path, sha256, applied_at]
      properties:
        path: { type: string }
        sha256: { type: string }
        applied_at: { type: string, format: date-time }
    TraefikConnection:
      type: object
      required: [id, name, host, port, user, auth, host_key_type, host_key_fingerprint, internal_ip, os_family, package_manager,
        init_system, os_name, arch, existing_binary, existing_configs, traefik_binary, config_dir, api_port, installed_version,
        ownership_confirmed, health, last_error, files]
      properties:
        id: { type: string }
        name: { type: string }
        host: { type: string }
        port: { type: integer }
        user: { type: string }
        auth: { type: string, enum: [hashi_key, private_key, password] }
        host_key_type: { type: string }
        host_key_fingerprint: { type: string }
        internal_ip: { type: string }
        os_family: { type: string, description: "alpine, debian or fedora; empty until validated" }
        package_manager: { type: string }
        init_system: { type: string }
        os_name: { type: string, description: PRETTY_NAME from os-release }
        arch: { type: string }
        existing_binary: { type: string }
        existing_configs: { type: array, items: { type: string } }
        traefik_binary: { type: string }
        config_dir: { type: string }
        api_port: { type: integer }
        installed_version: { type: string, description: "Traefik version Hashi installed; empty before the first apply" }
        ownership_confirmed: { type: boolean }
        health: { type: string, enum: [unknown, validating, healthy, degraded, failed] }
        last_validated_at: { type: string, format: date-time }
        last_error: { type: string }
        files: { type: array, items: { $ref: "#/components/schemas/TraefikFile" } }
    TraefikConnectionList:
      type: object
      required: [connections]
      properties:
        connections: { type: array, items: { $ref: "#/components/schemas/TraefikConnection" } }
    CertificateDistribution:
      type: object
      required: [connection_id, connection_name, state, fingerprint, error]
      properties:
        connection_id: { type: string }
        connection_name: { type: string }
        state: { type: string, enum: [pending, applied, verified, failed] }
        fingerprint: { type: string, description: What the host served at the last check }
        last_verified_at: { type: string, format: date-time }
        error: { type: string }
    Certificate:
      type: object
      required: [id, name, names, issuer, fingerprint, level, last_renewal_result, last_renewal_error, distributions]
      properties:
        id: { type: string }
        name: { type: string }
        names: { type: array, items: { type: string } }
        issuer: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        fingerprint: { type: string, description: SHA-256 of the leaf (hex) }
        level: { type: string, enum: ["", warning, critical, expired], description: "Expiry urgency (21/7 days)" }
        last_renewal_at: { type: string, format: date-time }
        last_renewal_result: { type: string, enum: ["", issued, renewed, failed] }
        last_renewal_error: { type: string }
        distributions: { type: array, items: { $ref: "#/components/schemas/CertificateDistribution" } }
    CertificateList:
      type: object
      required: [certificates]
      properties:
        certificates: { type: array, items: { $ref: "#/components/schemas/Certificate" } }
    DNSProviderInput:
      type: object
      required: [type, default_ttl]
      properties:
        type: { type: string, enum: [hetzner] }
        token: { type: string, writeOnly: true, description: "Cloud project API token; omit to keep the stored one" }
        default_ttl: { type: integer, minimum: 60, maximum: 86400, description: TTL for RRSets Hashi creates }
        zone_id: { type: string, description: "Provider zone ID chosen from `zones` when the root domain matched none" }
    DNSProvider:
      type: object
      required: [id, type, default_ttl, health, last_error]
      properties:
        id: { type: string }
        type: { type: string, enum: [hetzner] }
        default_ttl: { type: integer }
        health: { type: string, enum: [unknown, validating, healthy, degraded, failed] }
        last_validated_at: { type: string, format: date-time }
        last_error: { type: string }
    DNSProviderZone:
      type: object
      required: [id, name]
      properties:
        id: { type: string, description: Provider zone ID }
        name: { type: string }
    DNSConnectResult:
      type: object
      description: "`provider` and `zone` are absent when no zone was chosen (nothing stored)"
      required: [zones]
      properties:
        provider: { $ref: "#/components/schemas/DNSProvider" }
        zones:
          type: array
          description: Zones the token sees (only right after validation; empty when read back)
          items: { $ref: "#/components/schemas/DNSProviderZone" }
        zone: { $ref: "#/components/schemas/DNSZone" }
    DNSZone:
      type: object
      required: [id, name, provider, zone_ttl, rrset_count, last_refresh_error]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { $ref: "#/components/schemas/DNSProvider" }
        zone_ttl: { type: integer, description: Zone default TTL (RRSets without a TTL inherit it) }
        rrset_count: { type: integer }
        last_refreshed_at: { type: string, format: date-time }
        last_refresh_error: { type: string }
    DNSZoneList:
      type: object
      required: [zones]
      properties:
        zones: { type: array, items: { $ref: "#/components/schemas/DNSZone" } }
    DNSOrigin:
      type: string
      description: Hashi's ownership; `unmanaged` = not Hashi's
      enum: [system, managed, imported, user, unmanaged]
    DNSDecision:
      type: string
      enum: [import, leave, prune]
    DNSRRSet:
      type: object
      required: [name, fqdn, type, effective_ttl, values, protected, origin, pending]
      properties:
        name: { type: string, description: "Relative to the zone; `@` is the apex" }
        fqdn: { type: string }
        type: { type: string }
        ttl: { type: integer, description: Absent = zone default }
        effective_ttl: { type: integer }
        values: { type: array, items: { type: string }, description: Sorted; TXT values decoded to their text }
        protected: { type: boolean, description: The provider forbids changes; read-only to Hashi }
        origin: { $ref: "#/components/schemas/DNSOrigin" }
        observed_at: { type: string, format: date-time, description: Absent for a pending entry }
        pending: { type: boolean, description: A Hashi entry not yet created at the provider (values are the entry's) }
        entry: { $ref: "#/components/schemas/DNSRecord" }
    DNSRRSetList:
      type: object
      required: [zone, rrsets]
      properties:
        zone: { $ref: "#/components/schemas/DNSZone" }
        rrsets: { type: array, items: { $ref: "#/components/schemas/DNSRRSet" } }
    DNSImportRow:
      type: object
      required: [rrset, allowed_decisions]
      properties:
        rrset: { $ref: "#/components/schemas/DNSRRSet" }
        decision: { $ref: "#/components/schemas/DNSDecision" }
        allowed_decisions:
          type: array
          description: NS, SOA and change-protected RRSets allow only `leave` (invariant 2)
          items: { $ref: "#/components/schemas/DNSDecision" }
    DNSImportTable:
      type: object
      required: [zone, rows]
      properties:
        zone: { $ref: "#/components/schemas/DNSZone" }
        rows: { type: array, items: { $ref: "#/components/schemas/DNSImportRow" } }
    DNSImportDecision:
      type: object
      required: [name, type, decision]
      properties:
        name: { type: string }
        type: { type: string }
        decision: { $ref: "#/components/schemas/DNSDecision" }
    DNSImportDecisions:
      type: object
      required: [decisions]
      properties:
        decisions: { type: array, maxItems: 5000, items: { $ref: "#/components/schemas/DNSImportDecision" } }
    DNSZoneRef:
      type: object
      required: [zone_id]
      properties:
        zone_id: { type: string }
    DNSRecord:
      type: object
      description: A desired RRSet Hashi owns (manual entry or import, 03 §7)
      required: [id, zone_id, name, type, values, origin, display_name, dashboard, monitoring]
      properties:
        id: { type: string }
        zone_id: { type: string }
        name: { type: string }
        type: { type: string }
        ttl: { type: integer, description: Absent = zone default }
        values: { type: array, items: { type: string }, description: "TXT as plain text; empty for an address-set entry" }
        value_set_id: { type: string, description: "The address set the values follow (03 §7)" }
        origin: { $ref: "#/components/schemas/DNSOrigin" }
        display_name: { type: string }
        dashboard: { type: boolean }
        monitoring: { type: boolean }
    DNSRecordInput:
      type: object
      required: [zone_id, name, type, values]
      properties:
        zone_id: { type: string }
        name: { type: string, maxLength: 253, description: "Relative to the zone (`@` = apex) or absolute inside it" }
        type: { type: string, enum: [A, AAAA, CNAME, MX, TXT, SRV, CAA] }
        ttl: { type: integer, minimum: 60, maximum: 86400, description: Absent = zone default }
        values: { type: array, maxItems: 100, items: { type: string, maxLength: 4000 }, description: "Empty when value_set_id is set" }
        value_set_id: { type: string, description: "A and AAAA only: an address set whose addresses of the record's family are the values (03 §7)" }
        display_name: { type: string, maxLength: 200 }
        dashboard: { type: boolean }
        monitoring: { type: boolean }
    DNSRecordUpdate:
      type: object
      description: Replaces TTL, values and display fields; name and type cannot change
      required: [values]
      properties:
        ttl: { type: integer, minimum: 60, maximum: 86400, description: Absent = zone default }
        values: { type: array, maxItems: 100, items: { type: string, maxLength: 4000 }, description: "Empty when value_set_id is set" }
        value_set_id: { type: string, description: "A and AAAA only: an address set whose addresses of the record's family are the values (03 §7)" }
        display_name: { type: string, maxLength: 200 }
        dashboard: { type: boolean }
        monitoring: { type: boolean }
    DNSRecordSaved:
      type: object
      required: [record]
      properties:
        record: { $ref: "#/components/schemas/DNSRecord" }
        plan: { $ref: "#/components/schemas/SyncPlan" }
        plan_error: { type: string, description: Planning or applying failed; the entry is saved and the next sync retries }
    SyncPlanItemValue:
      type: object
      description: Exact DNS RRSet sent and verified (TXT as plain text)
      required: [name, type, values]
      properties:
        name: { type: string }
        type: { type: string }
        ttl: { type: [integer, "null"], description: null = zone default }
        values: { type: array, items: { type: string } }
        owner: { type: string, description: Ownership marker value written to the provider }
    SyncPlanItem:
      type: object
      required: [action, object, risk, note]
      properties:
        action: { type: string, enum: [create, update, delete, label, conflict] }
        object: { type: string, description: "e.g. `www A`" }
        before: { $ref: "#/components/schemas/SyncPlanItemValue" }
        after: { $ref: "#/components/schemas/SyncPlanItemValue" }
        before_text: { type: string, description: "Summary of the before state for non-DNS items (file hash, version, names)" }
        after_text: { type: string, description: "Summary of the after state for non-DNS items" }
        risk: { type: string, enum: [low, high] }
        note: { type: string }
    SyncPlan:
      type: object
      required: [id, subsystem, target, target_name, title, trigger, risk, status, created_by, created_at, approved_by, result, error, items]
      properties:
        id: { type: string }
        subsystem: { type: string, enum: [dns-records, dns-record-deletes, dns-prune, dns-probe, traefik, certificates, firewall] }
        target: { type: string }
        target_name: { type: string, description: "e.g. the zone name" }
        title: { type: string }
        trigger: { type: string, enum: [save, reconcile, manual, probe, prune] }
        risk: { type: string, enum: [low, high] }
        status: { type: string, enum: [pending, approved, applying, applied, failed, discarded, superseded] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        approved_by: { type: string, description: "`auto` for low-risk plans" }
        approved_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        result: { type: string }
        error: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/SyncPlanItem" }, description: Empty in the recent list }
    SyncPlanResult:
      type: object
      properties:
        plan: { $ref: "#/components/schemas/SyncPlan" }
    SyncPlanOverview:
      type: object
      required: [open, recent]
      properties:
        open: { type: array, items: { $ref: "#/components/schemas/SyncPlan" } }
        recent: { type: array, items: { $ref: "#/components/schemas/SyncPlan" } }
    FirewallTakeover:
      type: object
      description: The old firewall script's objects (05 §3.4); names of NetBird, Docker or Proxmox are refused
      required: [chains, rules, ipsets, cron_match, cron_files]
      properties:
        chains: { type: array, items: { type: string }, description: "Its own chains: flushed and deleted, with every jump to them" }
        rules: { type: array, items: { type: string }, description: "Rules in built-in chains, \"<table> -A <chain> <spec>\"; every copy goes" }
        ipsets: { type: array, items: { type: string } }
        cron_match: { type: array, items: { type: string }, description: Crontab lines holding one of these go }
        cron_files: { type: array, items: { type: string }, description: Files the script installs the crontab from }
    ServiceTarget:
      type: object
      required: [address, port]
      properties:
        address: { type: string, description: "IP address or host name; empty when set_id names an address set" }
        set_id: { type: string, description: "An address set (05a §5.2) whose addresses are load-balanced; instead of address" }
        port: { type: integer, minimum: 1, maximum: 65535 }
        weight: { type: integer, minimum: 0, maximum: 1000, description: "Load-balancing weight; 0 or absent = 1" }
    ServiceRoute:
      type: object
      required: [enabled, targets, path_match, path_value, priority, rewrite_mode, rewrite_pattern, rewrite_value]
      properties:
        id: { type: string, description: "ULID; absent for a new route" }
        enabled: { type: boolean }
        targets: { type: array, items: { $ref: "#/components/schemas/ServiceTarget" } }
        path_match: { type: string, enum: [prefix, exact, regex] }
        path_value: { type: string }
        priority: { type: integer, minimum: 1, maximum: 9999 }
        rewrite_mode: { type: string, enum: [none, replace_prefix, exact, regex, strip_prefix] }
        rewrite_pattern: { type: string, description: "regex rewrite: the pattern matched against the path" }
        rewrite_value: { type: string, description: "replace_prefix: new prefix; exact: new path; regex: replacement ($1…)" }
    ServiceInput:
      type: object
      required: [name, slug, kind, domain_mode, host_name, target]
      properties:
        name: { type: string }
        slug: { type: string }
        kind: { type: string, enum: [http, https, h2c, tcp, udp] }
        domain_mode: { type: string, enum: [root, subdomain, custom] }
        host_name: { type: string }
        enabled: { type: boolean, description: "On create only (default true); enable/disable have their own calls" }
        target: { $ref: "#/components/schemas/ServiceTarget" }
        tls_skip_verify: { type: boolean }
        tls_server_name: { type: string }
        tls_min_version: { type: string, enum: ["", VersionTLS12, VersionTLS13] }
        advanced_routes: { type: boolean }
        public_port: { type: integer, minimum: 1, maximum: 65535, description: "tcp/udp only: the public port; Traefik's entry point tcp-<port> / udp-<port> listens on it" }
        proxy_protocol: { type: boolean, description: "tcp only: send PROXY protocol v2 to the upstream" }
        entry_host_id: { type: string, description: "Service routing override: the firewall host public traffic enters through (03 §5.1)" }
        routes: { type: array, items: { $ref: "#/components/schemas/ServiceRoute" } }
        dashboard_visible: { type: boolean }
        monitoring_visible: { type: boolean }
        adguard_rewrite: { type: boolean }
    Service:
      type: object
      required: [id, name, slug, kind, domain_mode, host_name, enabled, origin, owner_feature, target, tls_skip_verify,
        tls_server_name, tls_min_version, advanced_routes, routes, dashboard_visible, monitoring_visible, adguard_rewrite,
        invalid_reason, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        kind: { type: string, enum: [http, https, h2c, tcp, udp] }
        domain_mode: { type: string, enum: [root, subdomain, custom] }
        host_name: { type: string }
        enabled: { type: boolean }
        origin: { type: string, enum: [system, managed, imported, user] }
        owner_feature: { type: string, description: "The feature that owns a system service, e.g. setup" }
        target: { $ref: "#/components/schemas/ServiceTarget" }
        tls_skip_verify: { type: boolean }
        tls_server_name: { type: string }
        tls_min_version: { type: string, enum: ["", VersionTLS12, VersionTLS13] }
        advanced_routes: { type: boolean }
        public_port: { type: integer, minimum: 1, maximum: 65535, description: "tcp/udp only: the public port; Traefik's entry point tcp-<port> / udp-<port> listens on it" }
        proxy_protocol: { type: boolean, description: "tcp only: send PROXY protocol v2 to the upstream" }
        entry_host_id: { type: string, description: "Service routing override (03 §5.1); empty = none" }
        routes: { type: array, items: { $ref: "#/components/schemas/ServiceRoute" } }
        dashboard_visible: { type: boolean }
        monitoring_visible: { type: boolean }
        adguard_rewrite: { type: boolean }
        invalid_reason: { type: string, description: "Why the service is left out of the rendered files; empty when valid" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ServiceList:
      type: object
      required: [services]
      properties:
        services: { type: array, items: { $ref: "#/components/schemas/Service" } }
    ServicePlans:
      type: object
      required: [plans, certificate_pending]
      properties:
        plans: { type: array, items: { $ref: "#/components/schemas/SyncPlan" }, description: "One Traefik plan per host that needed changes" }
        certificate_pending: { type: boolean, description: "A name is not covered by the current certificate yet; issuing runs in the background" }
    ServiceSaveResult:
      type: object
      required: [service, plans, certificate_pending]
      properties:
        service: { $ref: "#/components/schemas/Service" }
        plans: { type: array, items: { $ref: "#/components/schemas/SyncPlan" } }
        certificate_pending: { type: boolean }
    ServiceEffective:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string }
    SetupSystemService:
      type: object
      required: [service, state]
      properties:
        service: { $ref: "#/components/schemas/Service" }
        certificate_plan: { $ref: "#/components/schemas/SyncPlan" }
        traefik_plan: { $ref: "#/components/schemas/SyncPlan" }
        state: { $ref: "#/components/schemas/SetupState" }
    SetupHTTPSLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, description: "https://<admin domain>/setup#https=<nonce>" }
        expires_at: { type: string, format: date-time }
    SetupHTTPSProof:
      type: object
      required: [nonce]
      properties:
        nonce: { type: string }
    BaseSettings:
      type: object
      required: [root_domain, admin_domain, internal_url, sync_interval_seconds, theme, public_dashboard_enabled, public_status_enabled]
      properties:
        root_domain: { type: string }
        admin_domain: { type: string }
        internal_url: { type: string }
        sync_interval_seconds: { type: integer }
        theme: { type: string }
        public_dashboard_enabled: { type: boolean }
        public_status_enabled: { type: boolean }
    RecoveryKey:
      type: object
      required: [recovery_key]
      properties:
        recovery_key: { type: string, description: 14 groups of 4; the last group is the checksum }
    RecoveryKeyConfirm:
      type: object
      required: [checksum]
      properties:
        checksum: { type: string, maxLength: 16 }
    GeneralSettings:
      type: object
      required: [root_domain, admin_domain, internal_url, sync_interval_seconds, trusted_proxies]
      properties:
        root_domain: { type: string }
        admin_domain: { type: string }
        internal_url: { type: string }
        sync_interval_seconds: { type: integer }
        trusted_proxies: { type: array, items: { type: string } }
    SecuritySettings:
      type: object
      required: [admin_idle_timeout_minutes, bootstrap_allowed_cidrs]
      properties:
        admin_idle_timeout_minutes: { type: integer }
        bootstrap_allowed_cidrs: { type: array, items: { type: string } }
    AppearanceSettings:
      type: object
      required: [theme, public_dashboard_enabled, public_status_enabled]
      properties:
        theme: { type: string }
        public_dashboard_enabled: { type: boolean }
        public_status_enabled: { type: boolean }
    AllSettings:
      type: object
      required: [general, security, appearance]
      properties:
        general: { $ref: "#/components/schemas/GeneralSettings" }
        security: { $ref: "#/components/schemas/SecuritySettings" }
        appearance: { $ref: "#/components/schemas/AppearanceSettings" }
    VaultState:
      type: object
      required: [mode, locked, key_version, recovery_key_confirmed, secrets]
      properties:
        mode: { type: string, enum: [service, strict] }
        locked: { type: boolean }
        key_version: { type: integer }
        recovery_key_confirmed: { type: boolean }
        secrets: { type: integer }
    SecretMeta:
      type: object
      required: [id, class, purpose, created_at, updated_at]
      properties:
        id: { type: string }
        class: { type: string, enum: [service, admin] }
        purpose: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SecretList:
      type: object
      required: [secrets]
      properties:
        secrets: { type: array, items: { $ref: "#/components/schemas/SecretMeta" } }
    RevealedSecret:
      type: object
      required: [id, value]
      properties:
        id: { type: string }
        value: { type: string }
    AuditEvent:
      type: object
      required: [id, at, actor, action, target, outcome, ip, detail]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        outcome: { type: string, enum: [success, failure, denied] }
        ip: { type: string }
        detail: { type: object, additionalProperties: true }
    AuditPage:
      type: object
      required: [events]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        next_cursor: { type: string }
    JobRun:
      type: object
      required: [id, started_at, status, summary, error]
      properties:
        id: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        status: { type: string, enum: [running, succeeded, failed, interrupted] }
        duration_ms: { type: integer, format: int64 }
        summary: { type: string }
        error: { type: string }
    Job:
      type: object
      required: [kind, interval_seconds, enabled, next_run_at]
      properties:
        kind: { type: string }
        interval_seconds: { type: integer, format: int64 }
        enabled: { type: boolean }
        next_run_at: { type: string, format: date-time }
        last_run: { $ref: "#/components/schemas/JobRun" }
    JobList:
      type: object
      required: [jobs]
      properties:
        jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }
    LogLine:
      type: object
      required: [seq, line]
      properties:
        seq: { type: integer, format: int64 }
        line: { type: object, additionalProperties: true, description: One JSON log record (time, level, msg, attributes) }
    LogPage:
      type: object
      required: [lines, last_seq]
      properties:
        lines: { type: array, items: { $ref: "#/components/schemas/LogLine" } }
        last_seq: { type: integer, format: int64 }
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          additionalProperties: { type: string }
          description: Per dependency `ok` or the failure reason.
    Version:
      type: object
      required: [version, commit]
      properties:
        version: { type: string, examples: ["v0.1.0", "8b4bf95"] }
        commit: { type: string }
    IPSet:
      type: object
      required: [id, slug, name, description, kind, origin, system_key, editable, element_count, resolution_status,
        problems, address_set, v4_count, v6_count, created_at, updated_at]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [user, system, feed, dynamic] }
        origin: { type: string, enum: [system, managed, imported, user] }
        system_key: { type: string, description: "all, hashi_hosts, private_networks, …; empty for user sets" }
        editable: { type: boolean, description: "Elements and metadata can be changed by the user (user sets only)" }
        element_count: { type: integer }
        resolution_status: { type: string, enum: [ok, partial, empty] }
        problems: { type: array, items: { $ref: "#/components/schemas/IPSetProblem" } }
        address_set: { type: boolean, description: "Every leaf is ip, host or dns: usable in target positions" }
        v4_count: { type: integer, description: "Merged IPv4 prefixes" }
        v6_count: { type: integer, description: "Merged IPv6 prefixes" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IPSetList:
      type: object
      required: [sets]
      properties:
        sets: { type: array, items: { $ref: "#/components/schemas/IPSet" } }
    IPSetInput:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
    IPSetProblem:
      type: object
      required: [set_id, element_id, path, message]
      properties:
        set_id: { type: string }
        element_id: { type: string }
        path: { type: array, items: { type: string }, description: "Slugs from the compiled set to the failing item's set" }
        message: { type: string }
    IPItem:
      description: One IP item or a set reference (05a §2)
      oneOf:
        - $ref: "#/components/schemas/IPItemIP"
        - $ref: "#/components/schemas/IPItemCIDR"
        - $ref: "#/components/schemas/IPItemHost"
        - $ref: "#/components/schemas/IPItemDNS"
        - $ref: "#/components/schemas/IPItemSet"
      discriminator:
        propertyName: type
        mapping:
          ip: "#/components/schemas/IPItemIP"
          cidr: "#/components/schemas/IPItemCIDR"
          host: "#/components/schemas/IPItemHost"
          dns: "#/components/schemas/IPItemDNS"
          set: "#/components/schemas/IPItemSet"
    IPItemIP:
      type: object
      required: [type, address]
      properties:
        type: { type: string, enum: [ip] }
        address: { type: string, description: "IPv4 or IPv6; a /32 or /128 prefix is accepted on input" }
    IPItemCIDR:
      type: object
      required: [type, prefix]
      properties:
        type: { type: string, enum: [cidr] }
        prefix: { type: string, description: "Host bits are zeroed; a single-address prefix is stored as ip" }
    IPItemHost:
      type: object
      required: [type, host_id, scope]
      properties:
        type: { type: string, enum: [host] }
        host_id: { type: string }
        scope: { type: string, enum: [public, internal, all] }
    IPItemDNS:
      type: object
      required: [type, fqdn]
      properties:
        type: { type: string, enum: [dns] }
        fqdn: { type: string }
    IPItemSet:
      type: object
      required: [type, set_id]
      properties:
        type: { type: string, enum: [set] }
        set_id: { type: string }
    IPSetElement:
      type: object
      required: [id, position, origin, locked, item, label, note, expires_at, created_by, created_at]
      properties:
        id: { type: string }
        position: { type: integer }
        origin: { type: string }
        locked: { type: boolean }
        item: { $ref: "#/components/schemas/IPItem" }
        label: { type: string, description: "Short human form, e.g. \"192.0.2.0/24 (cidr)\" or \"office (set)\"" }
        note: { type: string }
        expires_at: { type: [string, "null"], format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    IPSetElementInput:
      type: object
      required: [item]
      properties:
        item: { $ref: "#/components/schemas/IPItem" }
        note: { type: string }
        expires_at: { type: [string, "null"], format: date-time }
    IPSetElementPage:
      type: object
      required: [elements, total, next_cursor]
      properties:
        elements: { type: array, items: { $ref: "#/components/schemas/IPSetElement" } }
        total: { type: integer, description: "Matching elements on all pages" }
        next_cursor: { type: string, description: "Empty on the last page" }
    IPSetResolved:
      type: object
      required: [status, problems, address_set, v4_count, v6_count, prefixes, addresses, next_cursor]
      properties:
        status: { type: string, enum: [ok, partial, empty] }
        problems: { type: array, items: { $ref: "#/components/schemas/IPSetProblem" } }
        address_set: { type: boolean }
        v4_count: { type: integer }
        v6_count: { type: integer }
        prefixes: { type: array, items: { type: string }, description: "One page of merged prefixes (v4 first)" }
        addresses: { type: array, items: { type: string }, description: "Single addresses in item order (target positions; first is primary)" }
        next_cursor: { type: string }
    IPSetConsumer:
      type: object
      required: [type, id, name, position]
      properties:
        type: { type: string, description: "ip_set, firewall_binding, dns_record, service, …" }
        id: { type: string }
        name: { type: string }
        position: { type: string, enum: [match, target] }
    IPSetConsumerList:
      type: object
      required: [consumers]
      properties:
        consumers: { type: array, items: { $ref: "#/components/schemas/IPSetConsumer" } }
    AddressLookup:
      type: object
      required: [address, sets]
      properties:
        address: { type: string, description: "Normalized (IPv4-mapped IPv6 shown as IPv4)" }
        sets: { type: array, items: { $ref: "#/components/schemas/AddressSetMatch" } }
    AddressSetMatch:
      type: object
      required: [set, matches]
      properties:
        set: { $ref: "#/components/schemas/IPSet" }
        matches: { type: array, items: { $ref: "#/components/schemas/AddressMatch" } }
    AddressMatch:
      type: object
      required: [path, set_id, element_id, label]
      properties:
        path: { type: array, items: { type: string }, description: "Slugs from the set down to the set holding the element" }
        set_id: { type: string }
        element_id: { type: string }
        label: { type: string }
    FirewallHostInput:
      type: object
      required: [name, edge_mode]
      properties:
        name: { type: string, description: "Becomes <name>.<root>: lowercase letters, digits, dashes" }
        edge_mode: { type: string, enum: [managed, external_nat] }
        host: { type: string, description: "SSH address (managed)" }
        port: { type: integer, minimum: 1, maximum: 65535 }
        user: { type: string }
        auth: { type: string, enum: [hashi_key, private_key, password] }
        credential: { type: string, writeOnly: true }
        passphrase: { type: string, writeOnly: true }
        host_key: { type: string, format: byte, description: "`key` from the scan the admin confirmed" }
        traefik_connection_id: { type: string }
        internal_traefik_ip: { type: string, description: "The linked Traefik's address in a managed subnet: the DNAT target" }
        route_via_host_id: { type: string, description: "Entry host for this host's services (on. → via.<entry>)" }
        public_ip_override: { type: string }
        public_ip6_override: { type: string }
        wan_iface_override: { type: string }
        subnets: { type: array, items: { type: string } }
        netbird_mode: { type: string, enum: [disabled, peer, routing] }
        netbird_iface: { type: string }
        netbird_port: { type: integer }
        drop_other_inbound: { type: boolean, description: "The admin accepted dropping every other new inbound connection" }
    FirewallNetBird:
      type: object
      required: [version, connected, overlay, port, kernel_interface, iface, routed]
      properties:
        version: { type: string }
        connected: { type: boolean }
        overlay: { type: string }
        port: { type: integer }
        kernel_interface: { type: boolean }
        iface: { type: string }
        routed: { type: array, items: { type: string } }
    FirewallFacts:
      type: object
      required: [kernel, os, nft_version, iptables_backend, tables, wan, candidates, ssh_from, netbird, warnings]
      properties:
        kernel: { type: string }
        os: { type: string }
        nft_version: { type: string }
        iptables_backend: { type: string }
        tables: { type: array, items: { type: string }, description: "Existing nft tables (family name)" }
        wan: { type: string }
        candidates: { type: array, items: { type: string }, description: "Networks on non-WAN interfaces: managed subnet proposals" }
        ssh_from: { type: string, description: "The address the host sees Hashi from (rescue path)" }
        netbird: { oneOf: [{ $ref: "#/components/schemas/FirewallNetBird" }, { type: "null" }] }
        warnings: { type: array, items: { type: string } }
    FirewallHost:
      type: object
      required: [id, name, edge_mode, host, port, user, auth, host_key_fingerprint, traefik_connection_id,
        internal_traefik_ip, route_via_host_id, public_ip, public_ip6, public_ip_override, public_ip6_override, wan_iface,
        wan_iface_override, subnets, netbird_mode, netbird_iface, netbird_port, drop_other_inbound, ownership_confirmed,
        health, last_error, last_validated_at, last_applied_at, facts]
      properties:
        id: { type: string }
        name: { type: string }
        edge_mode: { type: string, enum: [managed, external_nat] }
        host: { type: string }
        port: { type: integer }
        user: { type: string }
        auth: { type: string, enum: [hashi_key, private_key, password] }
        host_key_fingerprint: { type: string }
        traefik_connection_id: { type: string }
        internal_traefik_ip: { type: string }
        route_via_host_id: { type: string }
        public_ip: { type: string, description: "Effective (override, else detected)" }
        public_ip6: { type: string }
        public_ip_override: { type: string }
        public_ip6_override: { type: string }
        wan_iface: { type: string, description: "Effective (override, else detected)" }
        wan_iface_override: { type: string }
        subnets: { type: array, items: { type: string } }
        netbird_mode: { type: string, enum: [disabled, peer, routing] }
        netbird_iface: { type: string }
        netbird_port: { type: integer }
        drop_other_inbound: { type: boolean }
        ownership_confirmed: { type: boolean }
        health: { type: string, enum: [unknown, validating, healthy, degraded, failed] }
        last_error: { type: string }
        last_validated_at: { type: [string, "null"], format: date-time }
        last_applied_at: { type: [string, "null"], format: date-time }
        facts: { oneOf: [{ $ref: "#/components/schemas/FirewallFacts" }, { type: "null" }] }
    FirewallHostList:
      type: object
      required: [hosts]
      properties:
        hosts: { type: array, items: { $ref: "#/components/schemas/FirewallHost" } }
    FirewallRendered:
      type: object
      required: [table, allow, block, host_access, ports]
      properties:
        table: { type: string, description: "The libnftables JSON transaction" }
        allow: { type: integer, description: "Folded allow ranges (IPv4 + IPv6)" }
        block: { type: integer }
        host_access: { type: integer }
        ports: { type: array, items: { type: string }, description: "proto/port → target port" }
    FirewallRuleset:
      type: object
      required: [now, at_setup]
      properties:
        now: { type: string, description: "nft -j list ruleset, iptables(-legacy/-nft)-save, ipset save read now" }
        at_setup: { type: string, description: "The same read before Hashi's first apply" }
    FirewallBindings:
      type: object
      required: [allow, block]
      properties:
        allow: { type: array, items: { type: string }, description: "IP set IDs (hashi-hosts is always allowed in addition)" }
        block: { type: array, items: { type: string } }
    IPSetIDs:
      type: object
      required: [sets]
      properties:
        sets: { type: array, items: { type: string } }
    FirewallPlans:
      type: object
      required: [plans]
      properties:
        plans: { type: array, items: { $ref: "#/components/schemas/SyncPlan" } }
