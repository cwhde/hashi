      tags: [dns]
      x-hashi-scopes: [admin.write]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Refreshed
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSZone" } } }
        default: { $ref: "#/components/responses/Problem" }
