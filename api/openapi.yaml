openapi: 3.1.0
info:
  title: Hashi API
  version: 0.0.0
  description: |
    Source of truth for Hashi's HTTP API (01-platform.md §7). Go server code and the TypeScript client are
    generated from this file; CI fails when they are stale.

    Every operation declares `x-hashi-scopes` (all listed scopes are required). An empty list means no scope;
    `x-hashi-session: true` then still requires a valid session. `x-hashi-reauth: true` additionally requires a
    passkey reauthentication within the last five minutes. Unsafe methods on session endpoints need the
    `X-Hashi-CSRF` header from `GET /api/auth/session`. CI fails on an operation without `x-hashi-scopes`.
    Errors are RFC 9457 problem details. Timestamps are UTC (RFC 3339).
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Process is alive
      tags: [system]
      x-hashi-scopes: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      operationId: getReadyz
      summary: Dependencies are ready (database reachable, schema at head, not shutting down)
      tags: [system]
      x-hashi-scopes: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready; `checks` names the failing dependency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/version:
    get:
      operationId: getVersion
      summary: Build version of the running binary
      tags: [system]
      x-hashi-scopes: []
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  # ---- edge (06-edge-security.md §2) ----
  /api/edge-auth/forward:
    get:
      operationId: getEdgeAuthForward
      summary: Traefik forward auth for every edge service
      description: >-
        S4 stub: allows every request (204). Stage A and the rule engine replace it in S9/S10. Traefik reaches it
        directly (fail-closed services) or through the local `hashi-fa` fallback (fail-open services, 06 §2.1).
      tags: [edge]
      x-hashi-scopes: []
      responses:
        "204":
          description: Allowed

  # ---- auth (02-setup-auth.md §2–4) ----
  /api/auth/session:
    get:
      operationId: getAuthSession
      summary: Current session (or none), setup state flag and the CSRF token
      tags: [auth]
      x-hashi-scopes: []
      responses:
        "200":
          description: Session status
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/bootstrap/login:
    post:
      operationId: bootstrapLogin
      summary: Sign in with the one-time bootstrap credentials (private networks only, before setup completes)
      tags: [auth]
      x-hashi-scopes: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BootstrapLogin" } } }
      responses:
        "200":
          description: Signed in
          headers: { Set-Cookie: { $ref: "#/components/headers/SetCookie" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session, then clear the cookie
      tags: [auth]
      x-hashi-scopes: []
      x-hashi-session: true
      responses:
        "204":
          description: Signed out
          headers: { Set-Cookie: { $ref: "#/components/headers/SetCookie" } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/sessions:
    get:
      operationId: listSessions
      summary: Active admin sessions
      tags: [auth]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Sessions, newest first
          content: { application/json: { schema: { $ref: "#/components/schemas/SessionList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Revoke one session by its correlation ID
      tags: [auth]
      x-hashi-scopes: [security.manage]
      x-hashi-reauth: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      summary: Revoke every session except the current one
      tags: [auth]
      x-hashi-scopes: [security.manage]
      x-hashi-reauth: true
      responses:
        "200":
          description: Number revoked
          content: { application/json: { schema: { $ref: "#/components/schemas/RevokedCount" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/reauth/options:
    post:
      operationId: reauthOptions
      summary: Start a passkey reauthentication
      tags: [auth]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: WebAuthn request options
          content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyOptions" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/reauth:
    post:
      operationId: reauth
      summary: Finish a passkey reauthentication (valid five minutes)
      tags: [auth]
      x-hashi-scopes: [admin.read]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyResponse" } } }
      responses:
        "200":
          description: Reauthenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/passkeys:
    get:
      operationId: listPasskeys
      summary: Registered passkeys
      tags: [auth]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Passkeys
          content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/passkeys/register/options:
    post:
      operationId: passkeyRegisterOptions
      summary: Start adding another passkey
      tags: [auth]
      x-hashi-scopes: [admin.write]
      x-hashi-reauth: true
      responses:
        "200":
          description: WebAuthn creation options
          content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyOptions" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/passkeys/register/verify:
    post:
      operationId: passkeyRegisterVerify
      summary: Finish adding another passkey
      tags: [auth]
      x-hashi-scopes: [admin.write]
      x-hashi-reauth: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyResponse" } } }
      responses:
        "200":
          description: Stored passkey
          content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/passkeys/login/options:
    post:
      operationId: passkeyLoginOptions
      summary: Start a passkey sign-in
      tags: [auth]
      x-hashi-scopes: []
      responses:
        "200":
          description: WebAuthn request options
          content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyOptions" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/passkeys/login/verify:
    post:
      operationId: passkeyLoginVerify
      summary: Finish a passkey sign-in; issues a session bound to this IP
      tags: [auth]
      x-hashi-scopes: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyResponse" } } }
      responses:
        "200":
          description: Signed in
          headers: { Set-Cookie: { $ref: "#/components/headers/SetCookie" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/passkeys/{id}:
    patch:
      operationId: renamePasskey
      summary: Rename a passkey
      tags: [auth]
      x-hashi-scopes: [admin.write]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyRename" } } }
      responses:
        "200":
          description: Renamed
          content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePasskey
      summary: Delete a passkey (never the last one); revokes sessions signed in with it
      tags: [auth]
      x-hashi-scopes: [admin.write]
      x-hashi-reauth: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/recover:
    post:
      operationId: recoverLogin
      summary: Open a recovery session from a `hashi admin recover` link (private networks, once, 15 minutes)
      tags: [auth]
      x-hashi-scopes: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecoverLogin" } } }
      responses:
        "200":
          description: Recovery session; it can only register one new passkey
          headers: { Set-Cookie: { $ref: "#/components/headers/SetCookie" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/recover/passkey/options:
    post:
      operationId: recoverPasskeyOptions
      summary: Start registering a replacement passkey
      tags: [auth]
      x-hashi-scopes: [recovery.passkey]
      responses:
        "200":
          description: WebAuthn creation options
          content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyOptions" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/recover/passkey/verify:
    post:
      operationId: recoverPasskeyVerify
      summary: Finish registering the replacement passkey; ends the recovery session
      tags: [auth]
      x-hashi-scopes: [recovery.passkey]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyResponse" } } }
      responses:
        "200":
          description: Stored passkey; sign in with it next
          headers: { Set-Cookie: { $ref: "#/components/headers/SetCookie" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---- setup (02 §1) ----
  /api/setup:
    get:
      operationId: getSetup
      summary: Setup steps and their state
      tags: [setup]
      x-hashi-scopes: []
      responses:
        "200":
          description: Setup state
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupState" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/base-settings:
    put:
      operationId: putSetupBaseSettings
      summary: Step 2 — save and validate the base settings
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BaseSettings" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupState" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/dns/provider:
    put:
      operationId: putSetupDNSProvider
      summary: Step 3 — validate a DNS provider token read-only, pick the zone, store the first snapshot
      description: |
        Lists the zones the token sees and reads the chosen zone's RRSets; nothing is stored when that fails
        (invariant 3). Without `zone_id` the zone containing the root domain (or the stored zone) is chosen; when
        none is, only `zones` is returned, nothing is stored, and the admin sends the token again with a `zone_id`.
        Omitting `token` reuses the stored one.
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DNSProviderInput" } } }
      responses:
        "200":
          description: Validated and stored
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSConnectResult" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/dns/probe:
    post:
      operationId: postSetupDNSProbe
      summary: Step 3 — plan the write test (create and delete a `_hashi-test` TXT); nothing is written yet
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: The pending probe plan
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/dns/probe/{id}/run:
    post:
      operationId: runSetupDNSProbe
      summary: Step 3 — approve the shown probe plan and run it (invariant 4)
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan after the run
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/dns/import:
    get:
      operationId: getSetupDNSImport
      summary: Step 3 — import table of the managed zone
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: Import table
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSImportTable" } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putSetupDNSImport
      summary: Step 3 — save import decisions (prune marks become a pending prune plan); completes the step
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DNSImportDecisions" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupState" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/certificates:
    put:
      operationId: putSetupCertificates
      summary: Step 4 — store the certificate provider and register the ACME account with the CA
      description: |
        Validates the input, seals the EAB HMAC key, and registers (or finds) the ACME account. The step completes only
        when registration succeeded; otherwise the account is stored with `health: failed` and the step stays open.
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CertificateProviderInput" } } }
      responses:
        "200":
          description: Stored; `health` and `last_error` say whether the CA accepted the account
          content: { application/json: { schema: { $ref: "#/components/schemas/CertificateProvider" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/certificates/issue:
    post:
      operationId: issueSetupCertificates
      summary: Step 4 — issue the root and wildcard certificate now (low-risk plan, applied right away; takes a minute)
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: The certificates plan after the run (absent when nothing was needed)
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlanResult" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/traefik/identity:
    post:
      operationId: setupTraefikIdentity
      summary: Step 5 — Hashi's SSH public key (created on first call) for the host's authorized_keys
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: The public key line
          content: { application/json: { schema: { $ref: "#/components/schemas/TraefikIdentity" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/traefik/scan:
    post:
      operationId: scanSetupTraefikHost
      summary: Step 5 — read the host's SSH key for the admin to compare (nothing is stored)
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostKeyScanInput" } } }
      responses:
        "200":
          description: The host key; send `key` back with the connection once the admin confirmed the fingerprint
          content: { application/json: { schema: { $ref: "#/components/schemas/HostKey" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/traefik/connection:
    put:
      operationId: putSetupTraefikConnection
      summary: Step 5 — save the Traefik host with the confirmed host key and validate it over SSH
      description: |
        Saves the connection (credentials sealed, exactly the confirmed host key pinned), then logs in and detects the
        OS, package manager, init system and any existing Traefik, and checks Hashi can write in its state directory.
        A failed validation answers 200 with `health: failed` and `last_error`; invalid input answers 422.
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TraefikConnectionInput" } } }
      responses:
        "200":
          description: Saved and validated (see `health`)
          content: { application/json: { schema: { $ref: "#/components/schemas/TraefikConnection" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/traefik/confirm:
    post:
      operationId: confirmSetupTraefik
      summary: Step 5 — let Hashi take over the validated host (existing config is backed up first); completes the step
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: Confirmed
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupState" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/traefik/plan:
    post:
      operationId: planSetupTraefik
      summary: Step 5 — plan installing Traefik and Hashi's files on the confirmed host; nothing is written yet
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: The plan (absent when the host already matches)
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlanResult" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/traefik/plan/{id}/run:
    post:
      operationId: runSetupTraefikPlan
      summary: Step 5 — approve the shown Traefik plan and run it
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan after the run
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/passkey/options:
    post:
      operationId: setupPasskeyOptions
      summary: Step 9 — start registering the first passkey
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: WebAuthn creation options
          content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyOptions" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/passkey/verify:
    post:
      operationId: setupPasskeyVerify
      summary: Step 9 — finish registering the first passkey
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyResponse" } } }
      responses:
        "200":
          description: Stored passkey
          content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/recovery-key:
    post:
      operationId: setupRecoveryKey
      summary: Step 9 — generate the recovery key (shown once)
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: The recovery key; never returned again
          content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryKey" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/recovery-key/confirm:
    post:
      operationId: confirmRecoveryKey
      summary: Step 9 — confirm the recovery key by re-entering its last group; runs a test unlock
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryKeyConfirm" } } }
      responses:
        "200":
          description: Confirmed
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupState" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/complete:
    post:
      operationId: completeSetup
      summary: Step 11 — finish setup; destroys the bootstrap credentials and signs out bootstrap sessions
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: Completed
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupState" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---- settings (09 §2) ----
  /api/settings:
    get:
      operationId: getSettings
      summary: All settings categories
      tags: [settings]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Settings
          content: { application/json: { schema: { $ref: "#/components/schemas/AllSettings" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/settings/general:
    get:
      operationId: getGeneralSettings
      tags: [settings]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: General settings
          content: { application/json: { schema: { $ref: "#/components/schemas/GeneralSettings" } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putGeneralSettings
      summary: Save general settings; changing trusted proxies needs a recent passkey reauthentication
      tags: [settings]
      x-hashi-scopes: [settings.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GeneralSettings" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/GeneralSettings" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/settings/security:
    get:
      operationId: getSecuritySettings
      tags: [settings]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Security settings
          content: { application/json: { schema: { $ref: "#/components/schemas/SecuritySettings" } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putSecuritySettings
      tags: [settings]
      x-hashi-scopes: [settings.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SecuritySettings" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/SecuritySettings" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/settings/appearance:
    get:
      operationId: getAppearanceSettings
      tags: [settings]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Appearance settings
          content: { application/json: { schema: { $ref: "#/components/schemas/AppearanceSettings" } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putAppearanceSettings
      tags: [settings]
      x-hashi-scopes: [settings.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AppearanceSettings" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/AppearanceSettings" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---- dns (03-dns.md §7) ----
  /api/dns/zones:
    get:
      operationId: listDNSZones
      summary: Managed zones with their refresh state
      tags: [dns]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Zones
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSZoneList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/dns/zones/{id}/refresh:
    post:
      operationId: refreshDNSZone
      summary: Read the zone from the provider now and replace the observed snapshot (read-only towards the provider)
      tags: [dns]
      x-hashi-scopes: [admin.write]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Refreshed
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSZone" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/dns/zones/{id}/rrsets:
    get:
      operationId: listDNSRRSets
      summary: Observed RRSets of a zone with Hashi's ownership
      tags: [dns]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: origin
          in: query
          description: Only RRSets with this origin; `unmanaged` = not Hashi's
          schema: { type: string, enum: [system, managed, imported, user, unmanaged] }
        - { name: q, in: query, description: "Substring of name or value, or a type", schema: { type: string } }
      responses:
        "200":
          description: RRSets
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSRRSetList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/dns/import/{zoneId}:
    get:
      operationId: getDNSImport
      summary: Import table; rows without a decision are new since the last import
      tags: [dns]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: zoneId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Import table
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSImportTable" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/dns/import/{zoneId}/decisions:
    put:
      operationId: putDNSImportDecisions
      summary: Save import decisions; RRSets marked for prune go into a pending high-risk prune plan
      tags: [dns]
      x-hashi-scopes: [admin.write]
      parameters:
        - { name: zoneId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DNSImportDecisions" } } }
      responses:
        "200":
          description: Saved; the updated table
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSImportTable" } } }
        default: { $ref: "#/components/responses/Problem" }

  /api/dns/records:
    post:
      operationId: createDNSRecord
      summary: Add a manual entry; plans it right away (low risk applies, 01 §5.4)
      tags: [dns]
      x-hashi-scopes: [admin.write]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DNSRecordInput" } } }
      responses:
        "200":
          description: Saved, with the plan it caused (absent when nothing changes)
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSRecordSaved" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/dns/records/{id}:
    patch:
      operationId: updateDNSRecord
      summary: Change a manual or imported entry's TTL, values and display fields; plans it right away
      tags: [dns]
      x-hashi-scopes: [admin.write]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DNSRecordUpdate" } } }
      responses:
        "200":
          description: Saved, with the plan it caused
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSRecordSaved" } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDNSRecord
      summary: Remove an entry; the deletion at the provider is a high-risk plan awaiting approval
      tags: [dns]
      x-hashi-scopes: [admin.write]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The removed entry and the plan it caused
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSRecordSaved" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/dns/plan:
    post:
      operationId: planDNS
      summary: Plan the zone's entries now ("Sync now"); low-risk plans apply
      tags: [dns]
      x-hashi-scopes: [admin.write]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DNSZoneRef" } } }
      responses:
        "200":
          description: The plan, absent when the zone is in sync
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlanResult" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/dns/prune:
    post:
      operationId: planDNSPrune
      summary: Plan the removal of every RRSet marked for prune on the import table (high risk, 03 §4)
      tags: [dns]
      x-hashi-scopes: [admin.write]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DNSZoneRef" } } }
      responses:
        "200":
          description: The pending plan, absent when nothing is marked
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlanResult" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/dns/probe:
    post:
      operationId: planDNSProbe
      summary: Plan the write test (create, verify and delete a `_hashi-test` TXT); runs only after approval (invariant 4)
      tags: [dns]
      x-hashi-scopes: [admin.write]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DNSZoneRef" } } }
      responses:
        "200":
          description: The pending probe plan
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlanResult" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---- sync (01-platform.md §5) ----
  # ---- traefik and certificates (04, 03 §5.3) ----
  /api/traefik/connections:
    get:
      operationId: listTraefikConnections
      summary: Traefik hosts with their state and applied files
      tags: [traefik]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Connections
          content: { application/json: { schema: { $ref: "#/components/schemas/TraefikConnectionList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/traefik/connections/{id}/plan:
    post:
      operationId: planTraefikConnection
      summary: Plan the host's install, files and certificates (low-risk plans apply right away)
      tags: [traefik]
      x-hashi-scopes: [admin.write]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan (absent when the host already matches)
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlanResult" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/certificates:
    get:
      operationId: listCertificates
      summary: Certificates with expiry, last renewal and per-host distribution
      tags: [traefik]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Certificates
          content: { application/json: { schema: { $ref: "#/components/schemas/CertificateList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/certificates/{id}/renew:
    post:
      operationId: renewCertificate
      summary: Renew now — creates a low-risk certificates plan for this certificate (apply it from Changes)
      tags: [traefik]
      x-hashi-scopes: [admin.write]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlanResult" } } }
        default: { $ref: "#/components/responses/Problem" }

  /api/sync/plans:
    get:
      operationId: listSyncPlans
      summary: Open plans (pending, approved, applying) with items, and recently finished ones
      tags: [sync]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Plans
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlanOverview" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/sync/plans/{id}:
    get:
      operationId: getSyncPlan
      summary: One plan with its exact items
      tags: [sync]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/sync/plans/{id}/approve:
    post:
      operationId: approveSyncPlan
      summary: Approve a pending (high-risk) plan
      tags: [sync]
      x-hashi-scopes: [sync.apply]
      x-hashi-reauth: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Approved
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/sync/plans/{id}/apply:
    post:
      operationId: applySyncPlan
      summary: Apply an approved plan now; it is re-planned first and returns to approval if a new high-risk item appeared
      tags: [sync]
      x-hashi-scopes: [sync.apply]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan that ran (applied or failed), or the new plan awaiting approval
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/sync/plans/{id}/discard:
    post:
      operationId: discardSyncPlan
      summary: Drop a pending or approved plan
      tags: [sync]
      x-hashi-scopes: [sync.apply]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Discarded
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---- vault (02 §5) ----
  /api/vault:
    get:
      operationId: getVault
      summary: Vault mode and state
      tags: [vault]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Vault state
          content: { application/json: { schema: { $ref: "#/components/schemas/VaultState" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/vault/secrets:
    get:
      operationId: listSecrets
      summary: Stored secrets (metadata only, never values)
      tags: [vault]
      x-hashi-scopes: [secrets.manage]
      responses:
        "200":
          description: Secrets
          content: { application/json: { schema: { $ref: "#/components/schemas/SecretList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/vault/secrets/{id}/reveal:
    post:
      operationId: revealSecret
      summary: Reveal one secret value (audited)
      tags: [vault]
      x-hashi-scopes: [secrets.manage]
      x-hashi-reauth: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The value
          content: { application/json: { schema: { $ref: "#/components/schemas/RevealedSecret" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---- activity (10b §3) ----
  /api/activity/audit:
    get:
      operationId: listAuditEvents
      summary: Audit log, newest first
      tags: [activity]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Events
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/activity/jobs:
    get:
      operationId: listJobs
      summary: Background jobs with last and next run (invariant 15)
      tags: [activity]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Jobs
          content: { application/json: { schema: { $ref: "#/components/schemas/JobList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/activity/logs:
    get:
      operationId: listLogLines
      summary: Recent log lines (already redacted), after a sequence number
      tags: [activity]
      x-hashi-scopes: [admin.read]
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "200":
          description: Log lines
          content: { application/json: { schema: { $ref: "#/components/schemas/LogPage" } } }
        default: { $ref: "#/components/responses/Problem" }
components:
  headers:
    SetCookie:
      description: Session cookie (`__Host-hashi.session`, or `hashi.bootstrap` for bootstrap over plain HTTP)
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: "Stable URI per error kind, e.g. `/problems/reauth-required`" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    AuthSession:
      type: object
      required: [authenticated, setup_completed]
      properties:
        authenticated: { type: boolean }
        setup_completed: { type: boolean }
        id: { type: string, description: Correlation ID (salted hash prefix), not the token }
        method: { type: string, enum: [bootstrap, passkey, recovery] }
        scopes: { type: array, items: { type: string } }
        bound_ip: { type: string }
        created_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
        reauth_valid_until: { type: string, format: date-time }
        csrf_token: { type: string }
    BootstrapLogin:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 256 }
    RecoverLogin:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 128 }
    SessionInfo:
      type: object
      required: [id, method, bound_ip, created_at, last_seen_at, absolute_expires_at, current]
      properties:
        id: { type: string }
        method: { type: string }
        bound_ip: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
        current: { type: boolean }
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions: { type: array, items: { $ref: "#/components/schemas/SessionInfo" } }
    RevokedCount:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer }
    CeremonyOptions:
      type: object
      required: [ceremony_id, options]
      properties:
        ceremony_id: { type: string }
        options:
          type: object
          additionalProperties: true
          description: "WebAuthn options as produced by the server library (`{publicKey: …}`)"
    CeremonyResponse:
      type: object
      required: [ceremony_id, credential]
      properties:
        ceremony_id: { type: string }
        name: { type: string, maxLength: 64, description: Passkey name (registration only) }
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential serialized with `toJSON()`
    Passkey:
      type: object
      required: [id, name, label, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        label: { type: string, description: Authenticator model (AAGUID-derived), may be empty }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    PasskeyList:
      type: object
      required: [passkeys]
      properties:
        passkeys: { type: array, items: { $ref: "#/components/schemas/Passkey" } }
    PasskeyRename:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
    SetupStep:
      type: object
      required: [n, key, title, required, built, slice, status, last_error]
      properties:
        n: { type: integer }
        key: { type: string }
        title: { type: string }
        required: { type: boolean }
        built: { type: boolean, description: false = arrives in a later slice }
        slice: { type: string }
        status: { type: string, enum: [pending, in_progress, done, failed] }
        last_error: { type: string }
    SetupState:
      type: object
      required: [completed, steps]
      properties:
        completed: { type: boolean }
        steps: { type: array, items: { $ref: "#/components/schemas/SetupStep" } }
        base_settings: { $ref: "#/components/schemas/BaseSettings" }
        passkeys: { type: integer, description: Registered passkeys (setup sessions only) }
        dns: { $ref: "#/components/schemas/DNSConnectResult" }
        certificates: { $ref: "#/components/schemas/CertificateProvider" }
        traefik: { $ref: "#/components/schemas/TraefikConnection" }
    CertificateProviderInput:
      type: object
      required: [directory, email]
      properties:
        directory: { type: string, enum: [gts, letsencrypt, custom] }
        directory_url: { type: string, description: "ACME directory URL (custom only)" }
        email: { type: string }
        eab_kid: { type: string, description: External Account Binding key ID (required for gts) }
        eab_hmac: { type: string, writeOnly: true, description: "EAB HMAC key (base64url); omit to keep the stored one" }
        propagation_delay_s: { type: integer, minimum: 0, maximum: 600, description: "Extra wait after the value is visible (default 0)" }
        resolvers: { type: array, items: { type: string }, description: "DNS servers to check challenge values on; empty = the zone's nameservers" }
    CertificateProvider:
      type: object
      required: [directory, directory_url, email, eab_kid, has_eab_hmac, account_registered, propagation_delay_s, resolvers, health, last_error]
      properties:
        directory: { type: string, enum: [gts, letsencrypt, custom] }
        directory_url: { type: string }
        email: { type: string }
        eab_kid: { type: string }
        has_eab_hmac: { type: boolean }
        account_registered: { type: boolean }
        propagation_delay_s: { type: integer }
        resolvers: { type: array, items: { type: string } }
        health: { type: string, enum: [unknown, validating, healthy, degraded, failed] }
        last_validated_at: { type: string, format: date-time }
        last_error: { type: string }
    TraefikIdentity:
      type: object
      required: [public_key]
      properties:
        public_key: { type: string, description: authorized_keys line }
    HostKeyScanInput:
      type: object
      required: [host, port]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
    HostKey:
      type: object
      required: [type, fingerprint, key]
      properties:
        type: { type: string, description: "e.g. ssh-ed25519" }
        fingerprint: { type: string, description: "SHA256:… as ssh-keygen -lf shows it" }
        key: { type: string, format: byte, description: Wire-format public key (base64) }
    TraefikConnectionInput:
      type: object
      required: [name, host, port, user, auth, host_key]
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        user: { type: string }
        auth: { type: string, enum: [hashi_key, private_key, password] }
        credential: { type: string, writeOnly: true, description: "Private key or password; omit to keep the stored one" }
        passphrase: { type: string, writeOnly: true }
        host_key: { type: string, format: byte, description: "`key` from the scan the admin confirmed" }
        internal_ip: { type: string }
        traefik_binary: { type: string }
        config_dir: { type: string }
        api_port: { type: integer, minimum: 1024, maximum: 65534 }
    TraefikFile:
      type: object
      required: [path, sha256, applied_at]
      properties:
        path: { type: string }
        sha256: { type: string }
        applied_at: { type: string, format: date-time }
    TraefikConnection:
      type: object
      required: [id, name, host, port, user, auth, host_key_type, host_key_fingerprint, internal_ip, os_family, package_manager,
        init_system, os_name, arch, existing_binary, existing_configs, traefik_binary, config_dir, api_port, installed_version,
        ownership_confirmed, health, last_error, files]
      properties:
        id: { type: string }
        name: { type: string }
        host: { type: string }
        port: { type: integer }
        user: { type: string }
        auth: { type: string, enum: [hashi_key, private_key, password] }
        host_key_type: { type: string }
        host_key_fingerprint: { type: string }
        internal_ip: { type: string }
        os_family: { type: string, description: "alpine, debian or fedora; empty until validated" }
        package_manager: { type: string }
        init_system: { type: string }
        os_name: { type: string, description: PRETTY_NAME from os-release }
        arch: { type: string }
        existing_binary: { type: string }
        existing_configs: { type: array, items: { type: string } }
        traefik_binary: { type: string }
        config_dir: { type: string }
        api_port: { type: integer }
        installed_version: { type: string, description: "Traefik version Hashi installed; empty before the first apply" }
        ownership_confirmed: { type: boolean }
        health: { type: string, enum: [unknown, validating, healthy, degraded, failed] }
        last_validated_at: { type: string, format: date-time }
        last_error: { type: string }
        files: { type: array, items: { $ref: "#/components/schemas/TraefikFile" } }
    TraefikConnectionList:
      type: object
      required: [connections]
      properties:
        connections: { type: array, items: { $ref: "#/components/schemas/TraefikConnection" } }
    CertificateDistribution:
      type: object
      required: [connection_id, connection_name, state, fingerprint, error]
      properties:
        connection_id: { type: string }
        connection_name: { type: string }
        state: { type: string, enum: [pending, applied, verified, failed] }
        fingerprint: { type: string, description: What the host served at the last check }
        last_verified_at: { type: string, format: date-time }
        error: { type: string }
    Certificate:
      type: object
      required: [id, name, names, issuer, fingerprint, level, last_renewal_result, last_renewal_error, distributions]
      properties:
        id: { type: string }
        name: { type: string }
        names: { type: array, items: { type: string } }
        issuer: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        fingerprint: { type: string, description: SHA-256 of the leaf (hex) }
        level: { type: string, enum: ["", warning, critical, expired], description: "Expiry urgency (21/7 days)" }
        last_renewal_at: { type: string, format: date-time }
        last_renewal_result: { type: string, enum: ["", issued, renewed, failed] }
        last_renewal_error: { type: string }
        distributions: { type: array, items: { $ref: "#/components/schemas/CertificateDistribution" } }
    CertificateList:
      type: object
      required: [certificates]
      properties:
        certificates: { type: array, items: { $ref: "#/components/schemas/Certificate" } }
    DNSProviderInput:
      type: object
      required: [type, default_ttl]
      properties:
        type: { type: string, enum: [hetzner] }
        token: { type: string, writeOnly: true, description: "Cloud project API token; omit to keep the stored one" }
        default_ttl: { type: integer, minimum: 60, maximum: 86400, description: TTL for RRSets Hashi creates }
        zone_id: { type: string, description: "Provider zone ID chosen from `zones` when the root domain matched none" }
    DNSProvider:
      type: object
      required: [id, type, default_ttl, health, last_error]
      properties:
        id: { type: string }
        type: { type: string, enum: [hetzner] }
        default_ttl: { type: integer }
        health: { type: string, enum: [unknown, validating, healthy, degraded, failed] }
        last_validated_at: { type: string, format: date-time }
        last_error: { type: string }
    DNSProviderZone:
      type: object
      required: [id, name]
      properties:
        id: { type: string, description: Provider zone ID }
        name: { type: string }
    DNSConnectResult:
      type: object
      description: "`provider` and `zone` are absent when no zone was chosen (nothing stored)"
      required: [zones]
      properties:
        provider: { $ref: "#/components/schemas/DNSProvider" }
        zones:
          type: array
          description: Zones the token sees (only right after validation; empty when read back)
          items: { $ref: "#/components/schemas/DNSProviderZone" }
        zone: { $ref: "#/components/schemas/DNSZone" }
    DNSZone:
      type: object
      required: [id, name, provider, zone_ttl, rrset_count, last_refresh_error]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { $ref: "#/components/schemas/DNSProvider" }
        zone_ttl: { type: integer, description: Zone default TTL (RRSets without a TTL inherit it) }
        rrset_count: { type: integer }
        last_refreshed_at: { type: string, format: date-time }
        last_refresh_error: { type: string }
    DNSZoneList:
      type: object
      required: [zones]
      properties:
        zones: { type: array, items: { $ref: "#/components/schemas/DNSZone" } }
    DNSOrigin:
      type: string
      description: Hashi's ownership; `unmanaged` = not Hashi's
      enum: [system, managed, imported, user, unmanaged]
    DNSDecision:
      type: string
      enum: [import, leave, prune]
    DNSRRSet:
      type: object
      required: [name, fqdn, type, effective_ttl, values, protected, origin, pending]
      properties:
        name: { type: string, description: "Relative to the zone; `@` is the apex" }
        fqdn: { type: string }
        type: { type: string }
        ttl: { type: integer, description: Absent = zone default }
        effective_ttl: { type: integer }
        values: { type: array, items: { type: string }, description: Sorted; TXT values decoded to their text }
        protected: { type: boolean, description: The provider forbids changes; read-only to Hashi }
        origin: { $ref: "#/components/schemas/DNSOrigin" }
        observed_at: { type: string, format: date-time, description: Absent for a pending entry }
        pending: { type: boolean, description: A Hashi entry not yet created at the provider (values are the entry's) }
        entry: { $ref: "#/components/schemas/DNSRecord" }
    DNSRRSetList:
      type: object
      required: [zone, rrsets]
      properties:
        zone: { $ref: "#/components/schemas/DNSZone" }
        rrsets: { type: array, items: { $ref: "#/components/schemas/DNSRRSet" } }
    DNSImportRow:
      type: object
      required: [rrset, allowed_decisions]
      properties:
        rrset: { $ref: "#/components/schemas/DNSRRSet" }
        decision: { $ref: "#/components/schemas/DNSDecision" }
        allowed_decisions:
          type: array
          description: NS, SOA and change-protected RRSets allow only `leave` (invariant 2)
          items: { $ref: "#/components/schemas/DNSDecision" }
    DNSImportTable:
      type: object
      required: [zone, rows]
      properties:
        zone: { $ref: "#/components/schemas/DNSZone" }
        rows: { type: array, items: { $ref: "#/components/schemas/DNSImportRow" } }
    DNSImportDecision:
      type: object
      required: [name, type, decision]
      properties:
        name: { type: string }
        type: { type: string }
        decision: { $ref: "#/components/schemas/DNSDecision" }
    DNSImportDecisions:
      type: object
      required: [decisions]
      properties:
        decisions: { type: array, maxItems: 5000, items: { $ref: "#/components/schemas/DNSImportDecision" } }
    DNSZoneRef:
      type: object
      required: [zone_id]
      properties:
        zone_id: { type: string }
    DNSRecord:
      type: object
      description: A desired RRSet Hashi owns (manual entry or import, 03 §7)
      required: [id, zone_id, name, type, values, origin, display_name, dashboard, monitoring]
      properties:
        id: { type: string }
        zone_id: { type: string }
        name: { type: string }
        type: { type: string }
        ttl: { type: integer, description: Absent = zone default }
        values: { type: array, items: { type: string }, description: TXT as plain text }
        origin: { $ref: "#/components/schemas/DNSOrigin" }
        display_name: { type: string }
        dashboard: { type: boolean }
        monitoring: { type: boolean }
    DNSRecordInput:
      type: object
      required: [zone_id, name, type, values]
      properties:
        zone_id: { type: string }
        name: { type: string, maxLength: 253, description: "Relative to the zone (`@` = apex) or absolute inside it" }
        type: { type: string, enum: [A, AAAA, CNAME, MX, TXT, SRV, CAA] }
        ttl: { type: integer, minimum: 60, maximum: 86400, description: Absent = zone default }
        values: { type: array, minItems: 1, maxItems: 100, items: { type: string, maxLength: 4000 } }
        display_name: { type: string, maxLength: 200 }
        dashboard: { type: boolean }
        monitoring: { type: boolean }
    DNSRecordUpdate:
      type: object
      description: Replaces TTL, values and display fields; name and type cannot change
      required: [values]
      properties:
        ttl: { type: integer, minimum: 60, maximum: 86400, description: Absent = zone default }
        values: { type: array, minItems: 1, maxItems: 100, items: { type: string, maxLength: 4000 } }
        display_name: { type: string, maxLength: 200 }
        dashboard: { type: boolean }
        monitoring: { type: boolean }
    DNSRecordSaved:
      type: object
      required: [record]
      properties:
        record: { $ref: "#/components/schemas/DNSRecord" }
        plan: { $ref: "#/components/schemas/SyncPlan" }
        plan_error: { type: string, description: Planning or applying failed; the entry is saved and the next sync retries }
    SyncPlanItemValue:
      type: object
      description: Exact DNS RRSet sent and verified (TXT as plain text)
      required: [name, type, values]
      properties:
        name: { type: string }
        type: { type: string }
        ttl: { type: [integer, "null"], description: null = zone default }
        values: { type: array, items: { type: string } }
        owner: { type: string, description: Ownership marker value written to the provider }
    SyncPlanItem:
      type: object
      required: [action, object, risk, note]
      properties:
        action: { type: string, enum: [create, update, delete, label, conflict] }
        object: { type: string, description: "e.g. `www A`" }
        before: { $ref: "#/components/schemas/SyncPlanItemValue" }
        after: { $ref: "#/components/schemas/SyncPlanItemValue" }
        risk: { type: string, enum: [low, high] }
        note: { type: string }
    SyncPlan:
      type: object
      required: [id, subsystem, target, target_name, title, trigger, risk, status, created_by, created_at, approved_by, result, error, items]
      properties:
        id: { type: string }
        subsystem: { type: string, enum: [dns-records, dns-record-deletes, dns-prune, dns-probe, traefik, certificates] }
        target: { type: string }
        target_name: { type: string, description: "e.g. the zone name" }
        title: { type: string }
        trigger: { type: string, enum: [save, reconcile, manual, probe, prune] }
        risk: { type: string, enum: [low, high] }
        status: { type: string, enum: [pending, approved, applying, applied, failed, discarded, superseded] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        approved_by: { type: string, description: "`auto` for low-risk plans" }
        approved_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        result: { type: string }
        error: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/SyncPlanItem" }, description: Empty in the recent list }
    SyncPlanResult:
      type: object
      properties:
        plan: { $ref: "#/components/schemas/SyncPlan" }
    SyncPlanOverview:
      type: object
      required: [open, recent]
      properties:
        open: { type: array, items: { $ref: "#/components/schemas/SyncPlan" } }
        recent: { type: array, items: { $ref: "#/components/schemas/SyncPlan" } }
    BaseSettings:
      type: object
      required: [root_domain, admin_domain, internal_url, sync_interval_seconds, theme, public_dashboard_enabled, public_status_enabled]
      properties:
        root_domain: { type: string }
        admin_domain: { type: string }
        internal_url: { type: string }
        sync_interval_seconds: { type: integer }
        theme: { type: string }
        public_dashboard_enabled: { type: boolean }
        public_status_enabled: { type: boolean }
    RecoveryKey:
      type: object
      required: [recovery_key]
      properties:
        recovery_key: { type: string, description: 14 groups of 4; the last group is the checksum }
    RecoveryKeyConfirm:
      type: object
      required: [checksum]
      properties:
        checksum: { type: string, maxLength: 16 }
    GeneralSettings:
      type: object
      required: [root_domain, admin_domain, internal_url, sync_interval_seconds, trusted_proxies]
      properties:
        root_domain: { type: string }
        admin_domain: { type: string }
        internal_url: { type: string }
        sync_interval_seconds: { type: integer }
        trusted_proxies: { type: array, items: { type: string } }
    SecuritySettings:
      type: object
      required: [admin_idle_timeout_minutes, bootstrap_allowed_cidrs]
      properties:
        admin_idle_timeout_minutes: { type: integer }
        bootstrap_allowed_cidrs: { type: array, items: { type: string } }
    AppearanceSettings:
      type: object
      required: [theme, public_dashboard_enabled, public_status_enabled]
      properties:
        theme: { type: string }
        public_dashboard_enabled: { type: boolean }
        public_status_enabled: { type: boolean }
    AllSettings:
      type: object
      required: [general, security, appearance]
      properties:
        general: { $ref: "#/components/schemas/GeneralSettings" }
        security: { $ref: "#/components/schemas/SecuritySettings" }
        appearance: { $ref: "#/components/schemas/AppearanceSettings" }
    VaultState:
      type: object
      required: [mode, locked, key_version, recovery_key_confirmed, secrets]
      properties:
        mode: { type: string, enum: [service, strict] }
        locked: { type: boolean }
        key_version: { type: integer }
        recovery_key_confirmed: { type: boolean }
        secrets: { type: integer }
    SecretMeta:
      type: object
      required: [id, class, purpose, created_at, updated_at]
      properties:
        id: { type: string }
        class: { type: string, enum: [service, admin] }
        purpose: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SecretList:
      type: object
      required: [secrets]
      properties:
        secrets: { type: array, items: { $ref: "#/components/schemas/SecretMeta" } }
    RevealedSecret:
      type: object
      required: [id, value]
      properties:
        id: { type: string }
        value: { type: string }
    AuditEvent:
      type: object
      required: [id, at, actor, action, target, outcome, ip, detail]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        outcome: { type: string, enum: [success, failure, denied] }
        ip: { type: string }
        detail: { type: object, additionalProperties: true }
    AuditPage:
      type: object
      required: [events]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        next_cursor: { type: string }
    JobRun:
      type: object
      required: [id, started_at, status, summary, error]
      properties:
        id: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        status: { type: string, enum: [running, succeeded, failed, interrupted] }
        duration_ms: { type: integer, format: int64 }
        summary: { type: string }
        error: { type: string }
    Job:
      type: object
      required: [kind, interval_seconds, enabled, next_run_at]
      properties:
        kind: { type: string }
        interval_seconds: { type: integer, format: int64 }
        enabled: { type: boolean }
        next_run_at: { type: string, format: date-time }
        last_run: { $ref: "#/components/schemas/JobRun" }
    JobList:
      type: object
      required: [jobs]
      properties:
        jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }
    LogLine:
      type: object
      required: [seq, line]
      properties:
        seq: { type: integer, format: int64 }
        line: { type: object, additionalProperties: true, description: One JSON log record (time, level, msg, attributes) }
    LogPage:
      type: object
      required: [lines, last_seq]
      properties:
        lines: { type: array, items: { $ref: "#/components/schemas/LogLine" } }
        last_seq: { type: integer, format: int64 }
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          additionalProperties: { type: string }
          description: Per dependency `ok` or the failure reason.
    Version:
      type: object
      required: [version, commit]
      properties:
        version: { type: string, examples: ["v0.1.0", "8b4bf95"] }
        commit: { type: string }
