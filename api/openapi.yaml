openapi: 3.1.0
info:
  title: Hashi API
  version: 0.0.0
  description: |
    Source of truth for Hashi's HTTP API (01-platform.md §7). Go server code and the TypeScript client are
    generated from this file; CI fails when they are stale.

    Every operation declares `x-hashi-scopes` (all listed scopes are required). An empty list means no scope;
    `x-hashi-session: true` then still requires a valid session. `x-hashi-reauth: true` additionally requires a
    passkey reauthentication within the last five minutes. Unsafe methods on session endpoints need the
    `X-Hashi-CSRF` header from `GET /api/auth/session`. CI fails on an operation without `x-hashi-scopes`.
    Errors are RFC 9457 problem details. Timestamps are UTC (RFC 3339).
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Process is alive
      tags: [system]
      x-hashi-scopes: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      operationId: getReadyz
      summary: Dependencies are ready (database reachable, schema at head, not shutting down)
      tags: [system]
      x-hashi-scopes: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready; `checks` names the failing dependency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/version:
    get:
      operationId: getVersion
      summary: Build version of the running binary
      tags: [system]
      x-hashi-scopes: []
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  # ---- edge (06-edge-security.md §2) ----
  /api/edge-auth/forward:
    get:
      operationId: getEdgeAuthForward
      summary: Traefik forward auth for every edge service
      description: >-
        S4 stub: allows every request (204). Stage A and the rule engine replace it in S9/S10. Traefik reaches it
        directly (fail-closed services) or through the local `hashi-fa` fallback (fail-open services, 06 §2.1).
      tags: [edge]
      x-hashi-scopes: []
      responses:
        "204":
          description: Allowed

  # ---- auth (02-setup-auth.md §2–4) ----
  /api/auth/session:
    get:
      operationId: getAuthSession
      summary: Current session (or none), setup state flag and the CSRF token
      tags: [auth]
      x-hashi-scopes: []
      responses:
        "200":
          description: Session status
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/bootstrap/login:
    post:
      operationId: bootstrapLogin
      summary: Sign in with the one-time bootstrap credentials (private networks only, before setup completes)
      tags: [auth]
      x-hashi-scopes: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BootstrapLogin" } } }
      responses:
        "200":
          description: Signed in
          headers: { Set-Cookie: { $ref: "#/components/headers/SetCookie" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session, then clear the cookie
      tags: [auth]
      x-hashi-scopes: []
      x-hashi-session: true
      responses:
        "204":
          description: Signed out
          headers: { Set-Cookie: { $ref: "#/components/headers/SetCookie" } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/sessions:
    get:
      operationId: listSessions
      summary: Active admin sessions
      tags: [auth]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Sessions, newest first
          content: { application/json: { schema: { $ref: "#/components/schemas/SessionList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Revoke one session by its correlation ID
      tags: [auth]
      x-hashi-scopes: [security.manage]
      x-hashi-reauth: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      summary: Revoke every session except the current one
      tags: [auth]
      x-hashi-scopes: [security.manage]
      x-hashi-reauth: true
      responses:
        "200":
          description: Number revoked
          content: { application/json: { schema: { $ref: "#/components/schemas/RevokedCount" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/reauth/options:
    post:
      operationId: reauthOptions
      summary: Start a passkey reauthentication
      tags: [auth]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: WebAuthn request options
          content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyOptions" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/reauth:
    post:
      operationId: reauth
      summary: Finish a passkey reauthentication (valid five minutes)
      tags: [auth]
      x-hashi-scopes: [admin.read]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyResponse" } } }
      responses:
        "200":
          description: Reauthenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/passkeys:
    get:
      operationId: listPasskeys
      summary: Registered passkeys
      tags: [auth]
      x-hashi-scopes: [admin.read]
      responses:
        "200":
          description: Passkeys
          content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyList" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/passkeys/register/options:
    post:
      operationId: passkeyRegisterOptions
      summary: Start adding another passkey
      tags: [auth]
      x-hashi-scopes: [admin.write]
      x-hashi-reauth: true
      responses:
        "200":
          description: WebAuthn creation options
          content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyOptions" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/passkeys/register/verify:
    post:
      operationId: passkeyRegisterVerify
      summary: Finish adding another passkey
      tags: [auth]
      x-hashi-scopes: [admin.write]
      x-hashi-reauth: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyResponse" } } }
      responses:
        "200":
          description: Stored passkey
          content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/passkeys/login/options:
    post:
      operationId: passkeyLoginOptions
      summary: Start a passkey sign-in
      tags: [auth]
      x-hashi-scopes: []
      responses:
        "200":
          description: WebAuthn request options
          content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyOptions" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/passkeys/login/verify:
    post:
      operationId: passkeyLoginVerify
      summary: Finish a passkey sign-in; issues a session bound to this IP
      tags: [auth]
      x-hashi-scopes: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyResponse" } } }
      responses:
        "200":
          description: Signed in
          headers: { Set-Cookie: { $ref: "#/components/headers/SetCookie" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/passkeys/{id}:
    patch:
      operationId: renamePasskey
      summary: Rename a passkey
      tags: [auth]
      x-hashi-scopes: [admin.write]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyRename" } } }
      responses:
        "200":
          description: Renamed
          content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePasskey
      summary: Delete a passkey (never the last one); revokes sessions signed in with it
      tags: [auth]
      x-hashi-scopes: [admin.write]
      x-hashi-reauth: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/recover:
    post:
      operationId: recoverLogin
      summary: Open a recovery session from a `hashi admin recover` link (private networks, once, 15 minutes)
      tags: [auth]
      x-hashi-scopes: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecoverLogin" } } }
      responses:
        "200":
          description: Recovery session; it can only register one new passkey
          headers: { Set-Cookie: { $ref: "#/components/headers/SetCookie" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/recover/passkey/options:
    post:
      operationId: recoverPasskeyOptions
      summary: Start registering a replacement passkey
      tags: [auth]
      x-hashi-scopes: [recovery.passkey]
      responses:
        "200":
          description: WebAuthn creation options
          content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyOptions" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/recover/passkey/verify:
    post:
      operationId: recoverPasskeyVerify
      summary: Finish registering the replacement passkey; ends the recovery session
      tags: [auth]
      x-hashi-scopes: [recovery.passkey]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CeremonyResponse" } } }
      responses:
        "200":
          description: Stored passkey; sign in with it next
          headers: { Set-Cookie: { $ref: "#/components/headers/SetCookie" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---- setup (02 §1) ----
  /api/setup:
    get:
      operationId: getSetup
      summary: Setup steps and their state
      tags: [setup]
      x-hashi-scopes: []
      responses:
        "200":
          description: Setup state
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupState" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/base-settings:
    put:
      operationId: putSetupBaseSettings
      summary: Step 2 — save and validate the base settings
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BaseSettings" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupState" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/dns/provider:
    put:
      operationId: putSetupDNSProvider
      summary: Step 3 — validate a DNS provider token read-only, pick the zone, store the first snapshot
      description: |
        Lists the zones the token sees and reads the chosen zone's RRSets; nothing is stored when that fails
        (invariant 3). Without `zone_id` the zone containing the root domain (or the stored zone) is chosen; when
        none is, only `zones` is returned, nothing is stored, and the admin sends the token again with a `zone_id`.
        Omitting `token` reuses the stored one.
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DNSProviderInput" } } }
      responses:
        "200":
          description: Validated and stored
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSConnectResult" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/dns/probe:
    post:
      operationId: postSetupDNSProbe
      summary: Step 3 — plan the write test (create and delete a `_hashi-test` TXT); nothing is written yet
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: The pending probe plan
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/dns/probe/{id}/run:
    post:
      operationId: runSetupDNSProbe
      summary: Step 3 — approve the shown probe plan and run it (invariant 4)
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan after the run
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/dns/import:
    get:
      operationId: getSetupDNSImport
      summary: Step 3 — import table of the managed zone
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: Import table
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSImportTable" } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putSetupDNSImport
      summary: Step 3 — save import decisions (prune marks become a pending prune plan); completes the step
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DNSImportDecisions" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupState" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/certificates:
    put:
      operationId: putSetupCertificates
      summary: Step 4 — store the certificate provider and register the ACME account with the CA
      description: |
        Validates the input, seals the EAB HMAC key, and registers (or finds) the ACME account. The step completes only
        when registration succeeded; otherwise the account is stored with `health: failed` and the step stays open.
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CertificateProviderInput" } } }
      responses:
        "200":
          description: Stored; `health` and `last_error` say whether the CA accepted the account
          content: { application/json: { schema: { $ref: "#/components/schemas/CertificateProvider" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/certificates/issue:
    post:
      operationId: issueSetupCertificates
      summary: Step 4 — issue the root and wildcard certificate now (low-risk plan, applied right away; takes a minute)
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: The certificates plan after the run (absent when nothing was needed)
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlanResult" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/traefik/identity:
    post:
      operationId: setupTraefikIdentity
      summary: Step 5 — Hashi's SSH public key (created on first call) for the host's authorized_keys
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: The public key line
          content: { application/json: { schema: { $ref: "#/components/schemas/TraefikIdentity" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/traefik/scan:
    post:
      operationId: scanSetupTraefikHost
      summary: Step 5 — read the host's SSH key for the admin to compare (nothing is stored)
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostKeyScanInput" } } }
      responses:
        "200":
          description: The host key; send `key` back with the connection once the admin confirmed the fingerprint
          content: { application/json: { schema: { $ref: "#/components/schemas/HostKey" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/traefik/connection:
    put:
      operationId: putSetupTraefikConnection
      summary: Step 5 — save the Traefik host with the confirmed host key and validate it over SSH
      description: |
        Saves the connection (credentials sealed, exactly the confirmed host key pinned), then logs in and detects the
        OS, package manager, init system and any existing Traefik, and checks Hashi can write in its state directory.
        A failed validation answers 200 with `health: failed` and `last_error`; invalid input answers 422.
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TraefikConnectionInput" } } }
      responses:
        "200":
          description: Saved and validated (see `health`)
          content: { application/json: { schema: { $ref: "#/components/schemas/TraefikConnection" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/traefik/confirm:
    post:
      operationId: confirmSetupTraefik
      summary: Step 5 — let Hashi take over the validated host (existing config is backed up first); completes the step
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: Confirmed
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupState" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/traefik/plan:
    post:
      operationId: planSetupTraefik
      summary: Step 5 — plan installing Traefik and Hashi's files on the confirmed host; nothing is written yet
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: The plan (absent when the host already matches)
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlanResult" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/traefik/plan/{id}/run:
    post:
      operationId: runSetupTraefikPlan
      summary: Step 5 — approve the shown Traefik plan and run it
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan after the run
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/firewall/scan:
    post:
      operationId: scanSetupFirewallHost
      summary: Step 6 — read the firewall host's SSH key for the admin to compare (nothing is stored)
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostKeyScanInput" } } }
      responses:
        "200":
          description: The host key
          content: { application/json: { schema: { $ref: "#/components/schemas/HostKey" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/firewall/host:
    put:
      operationId: putSetupFirewallHost
      summary: Step 6 — save the first firewall host and validate it over SSH (read-only)
      description: |
        Saves the host (credentials sealed, the confirmed host key pinned) and, for a managed host, logs in and reads
        kernel, nftables, the iptables backend, NetBird, interfaces and the existing ruleset. Nothing on the host changes.
        A failed validation answers 200 with `health: failed` and `last_error`; invalid input answers 422.
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FirewallHostInput" } } }
      responses:
        "200":
          description: Saved and validated
          content: { application/json: { schema: { $ref: "#/components/schemas/FirewallHost" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/firewall/confirm:
    post:
      operationId: confirmSetupFirewall
      summary: Step 6 — let Hashi manage the validated host's firewall (its table only); completes the step
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: Confirmed
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupState" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/firewall/plan:
    post:
      operationId: planSetupFirewall
      summary: Step 6 — plan Hashi's first firewall apply on the confirmed host; nothing is written yet
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: The plan (absent when the host already matches)
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlanResult" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/firewall/plan/{id}/run:
    post:
      operationId: runSetupFirewallPlan
      summary: Step 6 — approve the shown firewall plan and run it under the rescue timer
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan after the run
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/system-service:
    post:
      operationId: createSetupSystemService
      summary: Step 7 — create the Hashi admin service from the base settings, issue a certificate that covers the admin domain when needed, and plan the Traefik host
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: The service and the plans (the Traefik plan is absent when the host already serves it)
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupSystemService" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/system-service/plan/{id}/run:
    post:
      operationId: runSetupSystemServicePlan
      summary: Step 7 — approve the shown Traefik plan and run it; the step completes once the host serves the admin domain
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The service and the plan after the run
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupSystemService" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/https/start:
    post:
      operationId: startSetupHTTPS
      summary: Step 8 — a one-time link (5 minutes) that opens setup on https://<admin domain>
      tags: [setup]
      x-hashi-scopes: [setup.manage]
      responses:
        "200":
          description: The link to open
          content: { application/json: { schema: { $ref: "#/components/schemas/SetupHTTPSLink" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/setup/https/proof:
    post:
      operationId: proveSetupHTTPS
      summary: Step 8 — called from https://<admin domain> with the link's nonce; accepted only through Hashi-managed Traefik (edge token, Host, HTTPS). Completes the step and signs the browser in there with a new bootstrap session
      tags: [setup]
      x-hashi-scopes: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetupHTTPSProof" } } }
      responses:
        "200":
          description: Proven; the session cookie is for the HTTPS origin
          headers: { Set-Cookie: { $ref: "#/components/headers/SetCookie" } }
