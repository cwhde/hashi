services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: hashi
      POSTGRES_USER: hashi
      POSTGRES_PASSWORD: hashi
    volumes:
      - hashi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hashi -d hashi"]
      interval: 5s
      timeout: 5s
      retries: 10

  hashi:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HASHI_ADMIN_PORT:-8080}:${HASHI_ADMIN_PORT:-8080}"
      - "${HASHI_PUBLIC_DASHBOARD_PORT:-8081}:${HASHI_PUBLIC_DASHBOARD_PORT:-8081}"
      - "${HASHI_PUBLIC_STATUS_PORT:-8082}:${HASHI_PUBLIC_STATUS_PORT:-8082}"
    environment:
      Hashi__Ports__Admin: ${HASHI_ADMIN_PORT:-8080}
      Hashi__Ports__PublicDashboard: ${HASHI_PUBLIC_DASHBOARD_PORT:-8081}
      Hashi__Ports__PublicStatus: ${HASHI_PUBLIC_STATUS_PORT:-8082}
      ConnectionStrings__Hashi: Host=postgres;Port=5432;Database=hashi;Username=hashi;Password=hashi
      # 32-byte base64 key for unattended provider sync (generate: openssl rand -base64 32)
      HASHI_SERVICE_SYNC_VAULT_KEY: ${HASHI_SERVICE_SYNC_VAULT_KEY:-}
    volumes:
      - hashi_data:/data
      - hashi_logs:/logs

volumes:
  hashi_data:
  hashi_logs:
  hashi_pg:
