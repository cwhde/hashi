# Generated by Hashi. Changes are overwritten.
http:
  routers:
    hashi-fa:
      rule: PathPrefix(`/`)
      entryPoints:
        - hashi-fa
      service: hashi-fa-failover
  middlewares:
    hashi-auth-closed:
      forwardAuth:
        address: http://192.0.2.5:3340/api/edge-auth/forward
        trustForwardHeader: true
    hashi-auth-open:
      forwardAuth:
        address: http://127.0.0.1:8081/api/edge-auth/forward
        trustForwardHeader: true
  services:
    hashi-fa-failover:
      failover:
        service: hashi-fa-primary
        fallback: ping@internal
    hashi-fa-primary:
      loadBalancer:
        servers:
          - url: http://192.0.2.5:3340
        healthCheck:
          path: /readyz
          interval: 5s
          timeout: 2s
