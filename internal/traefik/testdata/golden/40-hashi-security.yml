# Generated by Hashi. Changes are overwritten.
http:
  routers:
    hashi-fa:
      rule: PathPrefix(`/`)
      entryPoints:
        - hashi-fa
      service: hashi-fa-failover
    hashi-fa-closed:
      rule: PathPrefix(`/closed/`)
      entryPoints:
        - hashi-fa
      middlewares:
        - hashi-fa-closed-strip
      service: hashi-fa-primary
      priority: 100000
  middlewares:
    hashi-auth-closed:
      forwardAuth:
        authResponseHeaders:
          - X-Hashi-User
        address: http://127.0.0.1:8081/closed/api/edge-auth/forward
        trustForwardHeader: true
    hashi-auth-open:
      forwardAuth:
        authResponseHeaders:
          - X-Hashi-User
        address: http://127.0.0.1:8081/api/edge-auth/forward
        trustForwardHeader: true
    hashi-fa-closed-strip:
      stripPrefix:
        prefixes:
          - /closed
  services:
    hashi-fa-failover:
      failover:
        service: hashi-fa-primary
        fallback: ping@internal
    hashi-fa-primary:
      loadBalancer:
        servers:
          - url: http://192.0.2.5:3340
        healthCheck:
          path: /readyz
          interval: 5s
          timeout: 2s
