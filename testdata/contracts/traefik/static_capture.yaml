entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  traefik:
    address: "127.0.0.1:8080"
  hashi-fa:
    address: "127.0.0.1:8081"
    forwardedHeaders:
      trustedIPs:
        - 127.0.0.1/32
        - ::1/128
api:
  insecure: true
  dashboard: false
ping:
  entryPoint: traefik
providers:
  file:
    directory: /etc/hashi/traefik/dynamic
    watch: true
log:
  format: json
  level: INFO
  filePath: /var/log/hashi/traefik/traefik.log
accessLog:
  format: json
  filePath: /var/log/hashi/traefik/access.log
