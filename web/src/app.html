<!doctype html>
<html lang="en" data-theme="graphite" data-mode="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#0d0f12" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script>
			// Apply the stored theme before first paint (10-ui.md §4: no flash of the wrong theme).
			(function () {
				try {
					var r = document.documentElement;
					// A public page arrives with the owner's theme in its tag (bug 178): this browser's stored one may be old.
					var t = r.hasAttribute('data-public-theme') ? null : localStorage.getItem('hashi.theme');
					var modes = { graphite: 'dark', linen: 'light', verdant: 'dark', violet: 'dark' };
					if (t && modes[t]) {
						r.dataset.theme = t;
						r.dataset.mode = modes[t];
					} else if (t === 'custom') {
						// The custom theme's variables as theme.svelte.ts last applied them.
						var c = JSON.parse(localStorage.getItem('hashi.theme.vars') || 'null');
						if (c && c.vars) {
							for (var k in c.vars)
								if (k.indexOf('--') === 0) r.style.setProperty(k, String(c.vars[k]));
							r.dataset.theme = 'custom';
							r.dataset.mode = c.mode === 'light' ? 'light' : 'dark';
							r.style.colorScheme = r.dataset.mode;
						}
					}
					if (localStorage.getItem('hashi.solid') === '1') r.dataset.solid = '';
					// The phone browser bar in the theme's shell colour before first paint (bug 44).
					var shells = {
						graphite: '#0d0f12',
						linen: '#eae1d4',
						verdant: '#06120d',
						violet: '#0a0712'
					};
					var shell =
						shells[r.dataset.theme] || (r.style.getPropertyValue('--h-shell') || '').trim();
					if (shell)
						document.querySelector('meta[name="theme-color"]').setAttribute('content', shell);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
