<!doctype html>
<html lang="en" data-theme="graphite" data-mode="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<script>
			// Apply the stored theme before first paint (10-ui.md §4: no flash of the wrong theme).
			(function () {
				try {
					var r = document.documentElement;
					var t = localStorage.getItem('hashi.theme');
					var modes = { graphite: 'dark', linen: 'light', verdant: 'dark', violet: 'dark' };
					if (t && modes[t]) {
						r.dataset.theme = t;
						r.dataset.mode = modes[t];
					} else if (t === 'custom') {
						// The custom theme's variables as theme.svelte.ts last applied them.
						var c = JSON.parse(localStorage.getItem('hashi.theme.vars') || 'null');
						if (c && c.vars) {
							for (var k in c.vars)
								if (k.indexOf('--') === 0) r.style.setProperty(k, String(c.vars[k]));
							r.dataset.theme = 'custom';
							r.dataset.mode = c.mode === 'light' ? 'light' : 'dark';
							r.style.colorScheme = r.dataset.mode;
						}
					}
					if (localStorage.getItem('hashi.solid') === '1') r.dataset.solid = '';
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
